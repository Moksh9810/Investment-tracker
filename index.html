<style>
  :root{--ink:#0E1726;--surface:#16223A;--surface2:#1D2B47;--line:#27395C;--text:#E8EDF5;--muted:#8A9BB8;--brass:#C9A227;--brass-dim:#8f7522;--gain:#3DD68C;--loss:#F16C6C;--radius:14px;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--ink);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;padding:20px 16px 80px}

  .sec-btn{background:var(--surface2);color:var(--text);border:1px solid var(--line);padding:9px 14px;border-radius:10px;font-weight:600;font-size:13px;cursor:pointer;font-family:'Space Grotesk',sans-serif}

  .toast.show{opacity:1}
  .modal-ov{position:fixed;inset:0;background:rgba(6,10,18,.66);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;animation:mfade .15s ease}
  @keyframes mfade{from{opacity:0}to{opacity:1}}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:420px;width:100%;box-shadow:0 24px 70px rgba(0,0,0,.55)}
  .modal h3{margin-bottom:10px}
  .modal .modal-body{font-size:14px;line-height:1.6;color:var(--text)}
  .modal .mfld{margin-top:12px}.modal .mfld label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  .modal input{width:100%}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
  /* --- micro-interactions, focus states, skeletons (UI polish) --- */
  .add-btn,.sec-btn,.refresh-btn,.edit,.del{transition:transform .12s ease,filter .15s ease,border-color .15s ease,color .15s ease,background .15s ease}
  .add-btn:hover,.refresh-btn:hover{transform:translateY(-1px)}
  .add-btn:active,.sec-btn:active,.refresh-btn:active,.edit:active,.del:active{transform:translateY(1px)}
  .card,.add-box{transition:transform .15s ease,box-shadow .2s ease,border-color .2s ease}
  .card:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.28);border-color:var(--brass-dim)}
  .tabs button{transition:color .15s ease,border-color .15s ease,background .15s ease}
  .cancel-link{transition:color .15s ease}
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  input:focus,select:focus,textarea:focus{border-color:var(--brass);outline:none}
  .bad{border-color:var(--loss)!important;box-shadow:0 0 0 2px rgba(241,108,108,.18)}
  .sk{background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 37%,var(--surface) 63%);background-size:400% 100%;animation:sk 1.2s ease infinite;border-radius:10px}
  @keyframes sk{0%{background-position:100% 0}100%{background-position:-100% 0}}
  .sk-row{height:46px;margin-bottom:10px}.sk-card{height:92px}
  .toast{transition:opacity .25s ease,transform .25s ease;transform:translateY(8px)}
  .toast.show{transform:translateY(0)}
  body.light{--ink:#EEF2F8;--surface:#FFFFFF;--surface2:#F3F6FB;--line:#DCE3EE;--text:#1A2233;--muted:#5B6A83;--brass:#8a6d10;--brass-dim:#B8941f;--gain:#12925a;--loss:#cf4a4a}
  header{padding-right:44px;padding-left:46px}
  #themeBtn{position:fixed;top:10px;right:12px;z-index:900;background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:20px;width:38px;height:38px;cursor:pointer;font-size:16px;transition:transform .12s ease}
  #themeBtn:hover{transform:scale(1.06)}
  @keyframes chFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .add-box svg{animation:chFade .45s ease both}
  @media(max-width:720px){.summary{grid-template-columns:repeat(2,1fr)}.pl-strip .net{font-size:26px}.tbl{font-size:12px;display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}.tabs{width:210px}#themeBtn{top:8px;right:8px;width:34px;height:34px}#menuBtn{top:8px;left:8px;width:34px;height:34px}header{padding-left:42px}body{padding:14px 10px 20px}}

<div class="wrap">

<script>
/* Supabase ki values ab config.js me hain — is file me kuch nahi badalna. */
const SUPABASE_URL      = (window.SUPABASE_URL||'').trim();
const SUPABASE_ANON_KEY = (window.SUPABASE_ANON_KEY||'').trim();

let sb=null;
let state={stocks:[],mfs:[],loans:[],bonds:[]};
let activeTab='stocks';
let menuOpen=false;
function toggleMenu(){menuOpen=!menuOpen;document.querySelector('.tabs')&&document.querySelector('.tabs').classList.toggle('open',menuOpen);document.querySelector('.menu-overlay').classList.toggle('open',menuOpen);}
let editStock=null, editMf=null, editLoan=null, editBond=null;
let loanMode='simple', bondMode='fixed';
let myId=null,myEmail='',myIsAdmin=false,viewingUserId=null,viewingEmail='',adminUsers=[];
let appSettings={},supportMsgs=[],supportConvos=[],supportOpenUser=null,supportChannel=null;
let mySuper=false,canSupport=false,canAccounts=false,canSettings=false,adminPermUser=null;
let news=[];
let leaderboard=[],myLb={name:'',opted_in:false};
let myName='',myPhone='';
let myPremium=false,myPremiumUntil=null,myIsPremiumFlag=false,myRefCode='',premiumReqs=[];
let legalView=null;
let saveTimer=null;
const KEY='portfolio-bahikhata-v1';
function normalize(){state.stocks=state.stocks||[];state.mfs=state.mfs||[];state.loans=state.loans||[];state.bonds=state.bonds||[];}
function saveState(){
  normalize();
  try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
  if(sb&&viewingUserId){
    clearTimeout(saveTimer);
    saveTimer=setTimeout(async()=>{
      const {error}=await sb.from('portfolios').upsert({user_id:viewingUserId,data:state,updated_at:new Date().toISOString()});
      if(error)toast('Cloud save fail: '+error.message);
    },600);
  }
}
async function loadPortfolio(uid){
  const {data,error}=await sb.from('portfolios').select('data').eq('user_id',uid).maybeSingle();
  if(error){toast('Load fail: '+error.message);state={stocks:[],mfs:[],loans:[],bonds:[]};}
  else{state=(data&&data.data)||{stocks:[],mfs:[],loans:[],bonds:[]};}
  normalize();
}

const inr=n=>'₹'+(isFinite(n)?Math.round(n).toLocaleString('en-IN'):'0');
const inr2=n=>'₹'+(isFinite(n)?n.toLocaleString('en-IN',{maximumFractionDigits:2}):'0');
const uid=()=>Math.random().toString(36).slice(2,9);
const plClass=n=>n>=0?'gain':'loss';
const plSign=n=>(n>=0?'+':'');
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800);}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function attr(s){return String(s==null?'':s).replace(/"/g,'&quot;');}
function yearsBetween(d){if(!d)return 0;return Math.max(0,(new Date()-new Date(d))/(1000*60*60*24*365.25));}
function daysBetween(d){if(!d)return 0;return Math.max(0,Math.floor((new Date()-new Date(d))/(1000*60*60*24)));}
function monthsBetween(d){if(!d)return 0;const s=new Date(d),n=new Date();let m=(n.getFullYear()-s.getFullYear())*12+(n.getMonth()-s.getMonth());if(n.getDate()<s.getDate())m--;return Math.max(0,m);}

function loanInterest(l){
  const P=+l.principal||0;
  if(l.mode==='fixed'){
    const tot=+l.months||0, ma=+l.monthlyAmount||0;
    const elapsed=Math.min(tot,monthsBetween(l.startDate));
    return {mode:'fixed',interest:elapsed*ma,totalInterest:tot*ma,total:P+tot*ma,elapsed,months:tot,monthly:ma,remaining:Math.max(0,tot-elapsed),days:daysBetween(l.startDate)};
  }
  const r=(+l.rate||0)/100,t=yearsBetween(l.startDate);
  let amt;
  if(l.type==='simple')amt=P*(1+r*t);
  else{const n=l.type==='monthly'?12:l.type==='quarterly'?4:1;amt=P*Math.pow(1+r/n,n*t);}
  return {mode:'accrue',interest:amt-P,total:amt,days:daysBetween(l.startDate)};
}

function bondCalc(b){
  const face=+b.amount||0;
  if(b.btype==='trade'){
    const cur=(b.currentValue!=null&&b.currentValue!==''?+b.currentValue:face);
    return {btype:'trade',invested:face,current:cur,pl:cur-face,interestToDate:0};
  }
  if(b.btype==='fixedpay'){
    const ma=+b.monthlyAmount||0, tot=+b.months||0;
    const elapsed=tot?Math.min(tot,monthsBetween(b.buyDate)):monthsBetween(b.buyDate);
    const received=elapsed*ma;
    const totalInterest=tot?tot*ma:null;
    return {btype:'fixedpay',invested:face,current:face+received,interestToDate:received,totalInterest,monthly:ma,months:tot,elapsed,pl:received};
  }
  const r=(+b.rate||0)/100, tEl=yearsBetween(b.buyDate);
  const tMat=b.maturityDate?Math.max(0,(new Date(b.maturityDate)-new Date(b.buyDate))/(1000*60*60*24*365.25)):null;
  let interestToDate,totalInterest;
  if(b.freq==='cumulative'){interestToDate=face*(Math.pow(1+r,tEl)-1);totalInterest=tMat!=null?face*(Math.pow(1+r,tMat)-1):null;}
  else{interestToDate=face*r*tEl;totalInterest=tMat!=null?face*r*tMat:null;}
  return {btype:'fixed',invested:face,current:face+interestToDate,interestToDate,totalInterest,tMat,pl:interestToDate};
}

async function fetchMfNav(code){const r=await fetch('/api/mf?code='+encodeURIComponent(code));const j=await r.json();if(isFinite(j.nav))return j.nav;throw new Error('no nav');}
async function fetchStockPrice(symbol,exch){const r=await fetch('/api/stock?symbol='+encodeURIComponent(symbol)+'&exch='+exch);const j=await r.json();if(isFinite(j.price))return j.price;throw new Error('no price');}

async function refreshAll(){
  const btn=document.getElementById('refreshBtn');btn.disabled=true;btn.textContent='↻ Updating…';
  let mfOk=0,stkOk=0,stkFail=0;
  for(const m of state.mfs){if(m.schemeCode){try{m.currentNav=await fetchMfNav(m.schemeCode);mfOk++;}catch(e){}}}
  for(const s of state.stocks){try{s.currentPrice=await fetchStockPrice(s.symbol,s.exch);s.auto=true;stkOk++;}catch(e){s.auto=false;stkFail++;}}
  saveState();render();btn.disabled=false;btn.textContent='↻ Live Rates Update';
  checkAlerts();if(myLb.opted_in)updateMyLeaderboard();
  let msg='MF: '+mfOk+'/'+state.mfs.filter(m=>m.schemeCode).length;
  if(state.stocks.length)msg+=' · Stocks: '+stkOk+'/'+state.stocks.length+(stkFail?' ('+stkFail+' manual)':'');
  toast(msg);
}

function computeTotals(st){
  st=st||{};
  let sInv=0,sCur=0,mInv=0,mCur=0,lPrin=0,lInt=0,bInv=0,bCur=0;
  (st.stocks||[]).filter(x=>!x.exclude).forEach(s=>{sInv+=s.qty*s.buyPrice;sCur+=s.qty*(s.currentPrice||s.buyPrice);});
  (st.mfs||[]).filter(x=>!x.exclude).forEach(m=>{mInv+=m.units*m.buyNav;mCur+=m.units*(m.currentNav||m.buyNav);});
  (st.loans||[]).filter(x=>!x.exclude).forEach(l=>{const c=loanInterest(l);lPrin+=(+l.principal||0);lInt+=c.interest;});
  (st.bonds||[]).filter(x=>!x.exclude).forEach(b=>{const c=bondCalc(b);bInv+=c.invested;bCur+=c.current;});
  const invested=sInv+mInv+lPrin+bInv,current=sCur+mCur+lPrin+lInt+bCur;
  return {sInv,sCur,mInv,mCur,lPrin,lInt,bInv,bCur,bGain:bCur-bInv,invested,current,net:current-invested,stockPL:sCur-sInv,mfPL:mCur-mInv};
}
function totals(){return computeTotals(state);}

function render(){
  const t=totals(),netPct=t.invested?(t.net/t.invested*100):0;

function localStockMatch(q){

function stockSearch(q){
  clearTimeout(stockTimer);q=q.trim();const box=document.getElementById('stk-results');
  if(q.length<2){box.innerHTML='';return;}
  const local=localStockMatch(q);
  renderStockResults(local);
  stockTimer=setTimeout(async()=>{
    try{const res=await fetch('/api/stock-search?q='+encodeURIComponent(q));
      if(res.ok){const j=await res.json();if(Array.isArray(j)&&j.length){
        const seen=new Set(local.map(x=>x.symbol));
        renderStockResults(local.concat(j.filter(x=>!seen.has(x.symbol))));
      }}
    }catch(e){}
  },300);
}

    html:'<div class="mfld"><label>How many more units/shares?</label><input id="au-q" type="number" step="any" placeholder="e.g. 10"></div>'

    okText:'Add',

      if(!q||q<=0||!p||p<=0){toast('Enter valid units and price');return false;}
      var oldQty=+s.qty||0,oldCost=oldQty*(+s.buyPrice||0);

function splitStock(id){
  var s=state.stocks.find(function(x){return x.id===id;});if(!s)return;
  uiModal({title:'Stock split — '+escapeHtml(s.symbol),
    html:'Enter the split ratio (new shares per old share). e.g. <b>2</b> for 1→2, or <b>0.5</b> for a reverse split.<div class="mfld"><label>Ratio</label><input id="sp-r" type="number" step="any" value="2"></div>',
    okText:'Adjust',
    onOk:function(ov){
      var ratio=parseFloat(ov.querySelector('#sp-r').value);

      saveState();render();toast('Split adjusted (P/L stays the same)');

  const units=+document.getElementById('mf-units').value,nav=+document.getElementById('mf-nav').value,curnav=+document.getElementById('mf-curnav').value;
  if(!name){markInvalid('mf-name');toast('Pick or type the fund name');return;}
  if(!units||!nav){markInvalid([!units&&'mf-units',!nav&&'mf-nav'].filter(Boolean));toast('Enter units and buy NAV');return;}
  const dt=document.getElementById('mf-dt').value;
  if(editMf){const m=state.mfs.find(x=>x.id===editMf);const code=(mfSel&&mfSel.name===name)?mfSel.code:m.schemeCode;Object.assign(m,{name,units,buyNav:nav,buyDate:dt,schemeCode:code});if(curnav)m.currentNav=curnav;editMf=null;saveState();render();toast('Fund updated');if(code&&!curnav){try{m.currentNav=await fetchMfNav(code);saveState();render();}catch(e){}}mfSel=null;return;}
  const code=(mfSel&&mfSel.name===name)?mfSel.code:null;
  const m={id:uid(),schemeCode:code,name,units,buyNav:nav,buyDate:dt,currentNav:curnav||null};
  state.mfs.push(m);saveState();render();
  if(code){try{m.currentNav=await fetchMfNav(code);saveState();render();toast('Live NAV: '+inr2(m.currentNav));}catch(e){if(!curnav)toast('Live NAV unavailable — tap "Live Rates Update"');}}
  mfSel=null;
}
function setMfNav(id,v){const m=state.mfs.find(x=>x.id===id);if(m){m.currentNav=+v;saveState();render();checkAlerts();}}

function saveLoan(){
  const name=document.getElementById('ln-name').value.trim();
  const amt=+document.getElementById('ln-amt').value;
  const dt=document.getElementById('ln-dt').value;
  const note=document.getElementById('ln-note').value.trim();
  if(!name||!amt||!dt){markInvalid([!name&&'ln-name',!amt&&'ln-amt',!dt&&'ln-dt'].filter(Boolean));toast('Enter name, amount and date');return;}
  let obj;
  if(loanMode==='fixed'){
    const ma=+document.getElementById('ln-monthly').value,mo=+document.getElementById('ln-months').value;
    if(!ma||!mo){markInvalid([!ma&&'ln-monthly',!mo&&'ln-months'].filter(Boolean));toast('Enter monthly amount and number of months');return;}
    obj={borrower:name,principal:amt,startDate:dt,note,mode:'fixed',monthlyAmount:ma,months:mo};
  }else{
    const rate=+document.getElementById('ln-rate').value;
    if(!rate){markInvalid('ln-rate');toast('Enter interest %');return;}
    const type=loanMode==='compound'?document.getElementById('ln-freq').value:'simple';
    obj={borrower:name,principal:amt,startDate:dt,note,mode:'accrue',rate,type};
  }
  if(editLoan){const l=state.loans.find(x=>x.id===editLoan);['rate','type','monthlyAmount','months'].forEach(k=>delete l[k]);Object.assign(l,obj);editLoan=null;}
  else{obj.id=uid();state.loans.push(obj);}
  loanMode='simple';saveState();render();toast('Loan saved');
}

/* ---------- GRAPH ---------- */
function polar(cx,cy,r,ang){const a=(ang-90)*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];}
function arcPath(cx,cy,r,r2,a0,a1){
  const p0=polar(cx,cy,r,a1),p1=polar(cx,cy,r,a0),p2=polar(cx,cy,r2,a0),p3=polar(cx,cy,r2,a1);
  const large=(a1-a0)>180?1:0;
  return 'M'+p0[0]+' '+p0[1]+' A'+r+' '+r+' 0 '+large+' 0 '+p1[0]+' '+p1[1]+' L'+p2[0]+' '+p2[1]+' A'+r2+' '+r2+' 0 '+large+' 1 '+p3[0]+' '+p3[1]+' Z';
}
function svgDonut(segs){
  const total=segs.reduce((a,s)=>a+s.value,0);
  if(total<=0)return '<div class="empty">Nothing to show yet — add some holdings first.</div>';
  let ang=0,paths='';
  segs.forEach(s=>{const sweep=s.value/total*360;paths+='<path d="'+arcPath(90,90,80,48,ang,ang+sweep-0.5)+'" fill="'+s.color+'"/>';ang+=sweep;});
  const legend=segs.map(s=>'<div style="display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0"><span style="width:12px;height:12px;border-radius:3px;background:'+s.color+';display:inline-block"></span>'+s.label+' — <b class="num">'+inr(s.value)+'</b> <span style="color:var(--muted)">('+(s.value/total*100).toFixed(1)+'%)</span></div>').join('');
  return '<div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap"><svg width="180" height="180" viewBox="0 0 180 180">'+paths+'<text x="90" y="86" text-anchor="middle" fill="var(--muted)" font-size="11">Total</text><text x="90" y="104" text-anchor="middle" fill="var(--text)" font-size="15" font-weight="700">'+inr(total)+'</text></svg><div>'+legend+'</div></div>';
}
function svgLine(hist){
  if(!hist||hist.length<2)return '<div class="note">The trend starts from tomorrow — a point is added automatically each day you open the app.</div>';
  const w=580,h=190,pad=34;
  const vals=hist.map(p=>p.net);let min=Math.min.apply(null,vals),max=Math.max.apply(null,vals);
  if(min>0)min=0;if(max<0)max=0;if(min===max)max=min+1;
  const xs=i=>pad+(i/(hist.length-1))*(w-2*pad);
  const ys=v=>h-pad-((v-min)/(max-min))*(h-2*pad);
  const line=hist.map((p,i)=>xs(i)+','+ys(p.net)).join(' ');
  const zeroY=ys(0),last=hist[hist.length-1];
  return '<svg width="100%" viewBox="0 0 '+w+' '+h+'" style="max-width:'+w+'px">'
    +'<line x1="'+pad+'" y1="'+zeroY+'" x2="'+(w-pad)+'" y2="'+zeroY+'" stroke="var(--line)" stroke-dasharray="4 4"/>'
    +'<polyline points="'+line+'" fill="none" stroke="'+(last.net>=0?'var(--gain)':'var(--loss)')+'" stroke-width="2.5"/>'
    +'<circle cx="'+xs(hist.length-1)+'" cy="'+ys(last.net)+'" r="4" fill="'+(last.net>=0?'var(--gain)':'var(--loss)')+'"/>'
    +'<text x="'+(w-pad)+'" y="'+(ys(last.net)-8)+'" text-anchor="end" fill="var(--text)" font-size="12" font-weight="700">'+(last.net>=0?'+':'')+inr(last.net)+'</text></svg>'
    +'<div class="note">'+hist.length+'-day trend · first: '+hist[0].d+' → aaj: '+last.d+'</div>';
}
function plBars(t){
  const rows=[['Stocks',t.stockPL],['Mutual Funds',t.mfPL],['Bonds',t.bGain],['Loan Interest',t.lInt]];
  const maxAbs=Math.max(1,Math.max.apply(null,rows.map(r=>Math.abs(r[1]))));
  return rows.map(r=>{const w=Math.abs(r[1])/maxAbs*100,cl=r[1]>=0?'var(--gain)':'var(--loss)';
    return '<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px"><span>'+r[0]+'</span><span class="num" style="color:'+cl+'">'+(r[1]>=0?'+':'')+inr(r[1])+'</span></div><div style="background:var(--ink);border-radius:6px;height:10px"><div style="width:'+w+'%;height:100%;background:'+cl+';border-radius:6px"></div></div></div>';}).join('');
}
function renderGraph(){
  const t=totals();
  const segs=[{label:'Stocks',value:t.sCur,color:'#C9A227'},{label:'Mutual Funds',value:t.mCur,color:'#4C8DFF'},{label:'Bonds',value:t.bCur,color:'#3DD68C'},{label:'Loans',value:t.lPrin+t.lInt,color:'#B57BE0'}].filter(s=>s.value>0);
  var xr=portfolioXIRR();var absr=t.invested?(t.net/t.invested*100):0;
  var xirrBox='<div class="add-box"><h3>Return summary</h3><div style="display:flex;gap:28px;flex-wrap:wrap">'
    +'<div><div style="color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em">Absolute return</div><div class="num '+plClass(absr)+'" style="font-size:24px;font-weight:700;font-family:\'Space Grotesk\',sans-serif">'+(t.invested?((absr>=0?'+':'')+absr.toFixed(1)+'%'):'—')+'</div></div>'
    +'<div><div style="color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em">XIRR (salaana)</div><div class="num '+(xr==null?'':plClass(xr))+'" style="font-size:24px;font-weight:700;font-family:\'Space Grotesk\',sans-serif">'+(xr==null?'—':((xr>=0?'+':'')+(xr*100).toFixed(1)+'%'))+'</div></div>'
    +'</div><div class="note">Absolute = total growth. XIRR = true annualised return over time (holdings need buy dates).</div></div>';
  return renderEngagement()+xirrBox
    +'<div class="add-box"><h3>Where your money is (current value)</h3>'+svgDonut(segs)+'</div>'
    +'<div class="add-box"><h3>Net Profit / Loss — trend</h3>'+svgLine(state.history)+'</div>'
    +'<div class="add-box"><h3>Category-wise Profit / Loss</h3>'+plBars(t)+'</div>';
}
function maybeSnapshot(){
  if(!myId||viewingUserId!==myId)return;
  state.history=state.history||[];
  const today=new Date().toISOString().slice(0,10),t=computeTotals(state),last=state.history[state.history.length-1];
  if(!last||last.d!==today){state.history.push({d:today,net:t.net,cur:t.current,inv:t.invested});if(state.history.length>200)state.history=state.history.slice(-200);saveState();}
  else{last.net=t.net;last.cur=t.current;last.inv=t.invested;saveState();}
}

function computeStreak(){
  if(viewingUserId!==myId)return;
  state.meta=state.meta||{};
  var m=state.meta,today=new Date().toISOString().slice(0,10);
  if(m.lastOpen!==today){
    var y=new Date();y.setDate(y.getDate()-1);var yest=y.toISOString().slice(0,10);
    m.streak=(m.lastOpen===yest)?(m.streak||0)+1:1;
    m.bestStreak=Math.max(m.bestStreak||0,m.streak);
    m.firstOpen=m.firstOpen||today;m.lastOpen=today;saveState();
  }
}
function earnedBadges(){
  var t=totals(),m=state.meta||{},hold=state.stocks.length+state.mfs.length+state.bonds.length+state.loans.length,b=[];
  if(hold>=1)b.push({e:'🌱',n:'First Step'});
  if(hold>=5)b.push({e:'📈',n:'Investor'});
  if(hold>=10)b.push({e:'💼',n:'Portfolio Builder'});
  if((m.streak||0)>=3)b.push({e:'🔥',n:'3-day Streak'});
  if((m.streak||0)>=7)b.push({e:'⚡',n:'7-day Streak'});
  if(t.net>0)b.push({e:'💚',n:'In Profit'});
  if(state.stocks.length&&state.mfs.length&&state.bonds.length)b.push({e:'🧭',n:'Diversified'});
  return b;
}
function onboardItems(){
  var s=state,tot=s.stocks.length+s.mfs.length+s.bonds.length+s.loans.length;
  var cats=[s.stocks,s.mfs,s.bonds,s.loans].filter(function(a){return a.length;}).length;
  return [['Add your first holding',tot>0],['Add 3 holdings',tot>=3],['Use 2 different categories (stock/MF/bond/loan)',cats>=2],['Take a ⬇ Backup once',!!(s.meta&&s.meta.backedUp)]];

/* ---------- XIRR ---------- */
function xirrCalc(cfs){
  if(!cfs||cfs.length<2)return null;
  var times=cfs.map(function(c){return new Date(c.date).getTime();});
  var d0=Math.min.apply(null,times);
  var f=function(r){var s=0;for(var i=0;i<cfs.length;i++){var yrs=(times[i]-d0)/(1000*60*60*24*365.25);s+=cfs[i].amount/Math.pow(1+r,yrs);}return s;};
  var lo=-0.9999,hi=10,flo=f(lo),fhi=f(hi);
  if(!isFinite(flo)||!isFinite(fhi)||flo*fhi>0)return null;
  for(var k=0;k<200;k++){var mid=(lo+hi)/2,fm=f(mid);if(Math.abs(fm)<1e-7)return mid;if(flo*fm<0){hi=mid;fhi=fm;}else{lo=mid;flo=fm;}}
  return (lo+hi)/2;
}
function portfolioCF(){
  var cfs=[],cur=0,dated=0;
  function add(inv,curv,date){cur+=curv;if(date){cfs.push({amount:-inv,date:date});dated++;}}
  state.stocks.filter(function(x){return !x.exclude;}).forEach(function(s){add(s.qty*s.buyPrice,s.qty*(s.currentPrice||s.buyPrice),s.buyDate);});
  state.mfs.filter(function(x){return !x.exclude;}).forEach(function(m){add(m.units*m.buyNav,m.units*(m.currentNav||m.buyNav),m.buyDate);});
  state.bonds.filter(function(x){return !x.exclude;}).forEach(function(b){var c=bondCalc(b);add(c.invested,c.current,b.buyDate);});
  state.loans.filter(function(x){return !x.exclude;}).forEach(function(l){var c=loanInterest(l);add(+l.principal||0,(+l.principal||0)+c.interest,l.startDate);});
  cfs.push({amount:cur,date:new Date().toISOString().slice(0,10)});
  return {cfs:cfs,current:cur,dated:dated};
}
function portfolioXIRR(){var p=portfolioCF();if(p.dated<1)return null;return xirrCalc(p.cfs);}

  await afterLogin(data.session);
}
async function doLogout(){await sb.auth.signOut();myId=null;viewingUserId=null;state={stocks:[],mfs:[],loans:[],bonds:[]};renderAuth();}

async function doForgot(){
  const email=document.getElementById('au-email').value.trim();
  if(!email){toast('Enter your email above first, then tap this');return;}
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin});
  if(error){toast(error.message);return;}
  toast('Reset link sent — open your email and click the link.');
}
function renderResetPassword(){
  const ha=document.getElementById('hdrActions');if(ha)ha.style.display='none';
  document.getElementById('app').innerHTML='<div class="add-box" style="max-width:440px;margin:24px auto"><h3>Set a new password</h3>'
    +'<div class="fld" style="margin-bottom:14px"><label>New Password</label><input id="rp-pass" type="password" placeholder="6+ characters" style="width:100%"></div>'
    +'<button class="add-btn" onclick="doResetPassword()">Save</button></div>';
}
async function doResetPassword(){
  const p=document.getElementById('rp-pass').value;if(p.length<6){toast('Enter a password with 6+ characters');return;}
  const {error}=await sb.auth.updateUser({password:p});
  if(error){toast(error.message);return;}
  toast('Password updated!');
  const {data:{session}}=await sb.auth.getSession();
  if(session)await afterLogin(session);else renderAuth();
}

async function loadAdminUsers(){
  render();
  try{
    const [pr,po]=await Promise.all([
      sb.from('profiles').select('id,email,name,phone,is_super,can_support,can_accounts,can_settings,is_premium,premium_until').order('email'),
      sb.from('portfolios').select('user_id,data')
    ]);
    const pmap={};(po.data||[]).forEach(p=>pmap[p.user_id]=p.data||{});
    adminUsers=(pr.data||[]).map(u=>({id:u.id,email:u.email,name:u.name,phone:u.phone,is_super:u.is_super,can_support:u.can_support,can_accounts:u.can_accounts,can_settings:u.can_settings,is_premium:u.is_premium,premium_until:u.premium_until,tot:computeTotals(pmap[u.id]||{})}));
  }catch(e){adminUsers=[];}
  render();
}
function permBadges(u){
  var b=[];if(u.is_super)b.push('super');if(u.can_support)b.push('support');if(u.can_accounts)b.push('accounts');if(u.can_settings)b.push('settings');
  return b.length?' <span class="tag" style="color:var(--gain);display:inline">'+b.join(', ')+'</span>':'';
}
function renderAdmin(){
  if(adminPermUser){
    var u=adminUsers.find(function(x){return x.id===adminPermUser;});
    if(!u)return '<div class="empty">User not found.</div>';
    return '<div class="add-box"><h3>Access — '+escapeHtml(u.email)+' <span class="cancel-link" onclick="adminPermUser=null;render()">← back to list</span></h3>'
      +permToggle('Support — view and reply to chats','can_support',u.can_support,u.id)
      +permToggle('Accounts — view/edit all portfolios','can_accounts',u.can_accounts,u.id)
      +permToggle('Settings — change support number and announcement','can_settings',u.can_settings,u.id)
      +permToggle('SUPER ADMIN — everything + grant access to other admins','is_super',u.is_super,u.id)
      +'<div class="note">Changes apply instantly. The user gets the new access after logging in again.</div></div>';
  }
  if(!adminUsers.length)return '<div class="empty">Loading users… (or no users yet)</div>';
  var reqBox='';
  if(premiumReqs&&premiumReqs.length){
    var umap={};adminUsers.forEach(function(u){umap[u.id]=u;});
    reqBox='<div class="add-box"><h3>💳 Payment requests ('+premiumReqs.length+')</h3><table class="tbl"><thead><tr><th>User</th><th>UTR</th><th></th></tr></thead><tbody>'
      +premiumReqs.map(function(p){var u=umap[p.user_id];return '<tr><td><span class="name">'+escapeHtml(u?(u.name||u.email):p.user_id)+'</span><span class="tag">'+(u&&u.phone?'📱 '+escapeHtml(u.phone)+' · ':'')+'₹'+escapeHtml(p.amount||'')+'</span></td><td class="num">'+escapeHtml(p.utr||'')+'</td><td><button class="edit" onclick="approvePayment(\''+p.id+'\',\''+p.user_id+'\')">✅ Approve</button><button class="del" onclick="rejectPayment(\''+p.id+'\')">✕</button></td></tr>';}).join('')
      +'</tbody></table><div class="note">Approving grants the user 30 days of premium. (Only super admin can grant.)</div></div>';
  }
  var rows=adminUsers.map(function(u){
    var prem=u.is_premium||(u.premium_until&&new Date(u.premium_until)>new Date());
    return '<tr>'
    +'<td><span class="name">'+escapeHtml(u.name||u.email||'—')+'</span>'+(prem?' <span class="tag" style="color:var(--brass);display:inline">⭐ premium</span>':'')+'<span class="tag">'+escapeHtml(u.email||'')+(u.phone?' · 📱 '+escapeHtml(u.phone):'')+'</span>'+permBadges(u)+'</td>'
    +'<td class="num">'+inr(u.tot.current)+'</td>'
    +'<td class="num '+plClass(u.tot.net)+'">'+plSign(u.tot.net)+inr(u.tot.net)+'</td>'
    +'<td><button class="edit" onclick="openUser(\''+u.id+'\',\''+escapeHtml(u.email||'')+'\')">Open</button>'
    +(mySuper?'<button class="edit" onclick="adminPermUser=\''+u.id+'\';render()">Access</button><button class="edit" onclick="grantDays(\''+u.id+'\',30)">+30d ⭐</button>':'')+'</td></tr>';}).join('');
  return reqBox+'<div class="add-box"><h3>All users <button class="sec-btn" style="float:right" onclick="exportAllUsers()">⬇ Export all data</button></h3><table class="tbl"><thead><tr><th>User</th><th>Net Worth</th><th>P/L</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>'
    +'<div class="note">"Open" for portfolio, '+(mySuper?'"Access" for admin rights, "+30d ⭐" for premium.':'')+' Use "← my account" above to go back.</div></div>';
}
async function setPerm(uid,field,val){
  var patch={};patch[field]=val;
  var r=await sb.from('profiles').update(patch).eq('id',uid);
  if(r.error){toast(r.error.message);return;}
  var u=adminUsers.find(function(x){return x.id===uid;});if(u)u[field]=val;
  render();toast('Access updated');
}
function permToggle(label,field,val,uid){
  return '<label style="display:flex;gap:10px;align-items:center;margin:10px 0;font-size:13px;cursor:pointer"><input type="checkbox" '+(val?'checked':'')+' onchange="setPerm(\''+uid+'\',\''+field+'\',this.checked)" style="width:16px;height:16px"> '+label+'</label>';
}
function openUser(uid,email){viewingUserId=uid;viewingEmail=email;loadPortfolio(uid).then(()=>{activeTab='stocks';render();});}
function backToMine(){viewingUserId=myId;viewingEmail=myEmail;loadPortfolio(myId).then(()=>{activeTab='stocks';render();});}

async function afterLogin(session){
  myId=session.user.id;myEmail=session.user.email;
  const ha=document.getElementById('hdrActions');if(ha)ha.style.display='flex';
  try{const r=await sb.from('profiles').select('is_super,can_support,can_accounts,can_settings,name,phone,is_premium,premium_until,referral_code').eq('id',myId).maybeSingle();
    const d=r.data||{};mySuper=!!d.is_super;canSupport=mySuper||!!d.can_support;canAccounts=mySuper||!!d.can_accounts;canSettings=mySuper||!!d.can_settings;
    myName=d.name||'';myPhone=d.phone||'';
    myIsPremiumFlag=!!d.is_premium;myPremiumUntil=d.premium_until||null;myRefCode=d.referral_code||'';
    myPremium=myIsPremiumFlag||(myPremiumUntil&&new Date(myPremiumUntil)>new Date());
    myIsAdmin=mySuper||canSupport||canAccounts||canSettings;
  }catch(e){mySuper=canSupport=canAccounts=canSettings=myIsAdmin=false;}
  try{const st=await sb.from('app_settings').select('*').eq('id',1).maybeSingle();appSettings=st.data||{};}catch(e){appSettings={};}
  setupRealtime();
  viewingUserId=myId;viewingEmail=myEmail;
  await loadPortfolio(myId);
  maybeSnapshot();
  computeStreak();
  try{const lr=await sb.from('leaderboard').select('name,opted_in').eq('user_id',myId).maybeSingle();myLb=lr.data||{name:'',opted_in:false};}catch(e){myLb={name:'',opted_in:false};}
  if(myLb.opted_in)updateMyLeaderboard();
  checkAlerts();
  const ac=document.getElementById('autoChk');if(ac)ac.checked=autoOn;
  activeTab='graph';render();
}
async function initApp(){
  if(!SUPABASE_URL||!SUPABASE_ANON_KEY||SUPABASE_URL.indexOf('YAHAN')>-1||SUPABASE_ANON_KEY.indexOf('YAHAN')>-1){document.getElementById('app').innerHTML='<div class="add-box" style="max-width:520px;margin:24px auto"><h3>One quick setup left</h3><div class="note">Add your SUPABASE_URL and PUBLISHABLE KEY in config.js (see README), then redeploy.</div></div>';return;}
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  var pg=new URLSearchParams(location.search).get('page');
  if(pg&&['terms','privacy','refund','disclaimer'].indexOf(pg)>-1){
    try{const st=await sb.from('app_settings').select('*').eq('id',1).maybeSingle();appSettings=st.data||{};}catch(e){}
    legalView=pg;renderLegalPage();return;
  }
  try{const st0=await sb.from('app_settings').select('*').eq('id',1).maybeSingle();appSettings=st0.data||{};}catch(e){}
  const {data:{session}}=await sb.auth.getSession();
  if(session){await afterLogin(session);}else{renderLanding();}
  sb.auth.onAuthStateChange((ev,s)=>{if(ev==='PASSWORD_RECOVERY'){renderResetPassword();return;}if(s&&!myId){afterLogin(s);}if(!s&&myId){myId=null;renderLanding();}});
}

  const ha=document.getElementById('hdrActions');if(ha)ha.style.display='none';
  var price=(appSettings.premium_price||'').trim();
  document.getElementById('app').innerHTML=
    '<div style="max-width:820px;margin:0 auto">'
    +'<div style="text-align:center;padding:30px 16px 10px">'
    +'<div style="font-size:44px">📊</div>'
    +'<h2 style="font-size:26px;margin:8px 0">All your investments, in one place</h2>'
    +'<div class="note" style="font-size:14px;max-width:520px;margin:0 auto">Stocks, mutual funds, bonds and loans — live prices, accurate profit/loss, XIRR and reports. Simple and clear.</div>'
    +'<div style="margin-top:18px"><button class="add-btn" onclick="renderAuth()">Get started free</button></div>'+'<div style="margin-top:10px;font-size:12px;color:var(--muted)">🔒 Bank-grade encryption · 📈 Live NSE &amp; AMFI data · Free to start</div>'
    +'</div>'
    +'<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:20px">'

    +landCard('🧮','Real returns','Absolute + XIRR (true annualised return over time).')
    +landCard('📊','Charts & reports','Allocation, trends, and one-click PDF reports.')
    +landCard('🔔','Price alerts','Know instantly when a price hits your target.')
    +landCard('🏆','Leaderboard','Compare your % return with others (opt-in).')

    +'</div>'
    +'<div class="add-box" style="margin-top:20px;text-align:center"><h3>Premium '+(price?'— just ₹'+escapeHtml(price):'')+'</h3><div class="note">7-day free trial. PDF reports, price alerts, and unlimited features. Cancel anytime.</div><div style="margin-top:12px"><button class="add-btn" onclick="renderAuth()">Create account</button></div></div>'
    +faqBlock()

}
function faqItem(q,a){return '<details style="border-top:1px solid var(--line);padding:10px 0"><summary style="cursor:pointer;font-weight:600;font-size:14px">'+q+'</summary><div class="note" style="margin-top:6px">'+a+'</div></details>';}
function faqBlock(){return '<div class="add-box" style="margin-top:20px"><h3>Frequently asked</h3>'
 +faqItem('Is my money safe?','We never touch your money \u2014 this is a tracking tool only. Your data is encrypted and only you can see your amounts.')
 +faqItem('Where do live prices come from?','Stock prices from public market data and mutual-fund NAVs from AMFI, refreshed during market hours.')
 +faqItem('Is this investment advice?','No \u2014 everything here is for information only. Always consult a SEBI-registered advisor before investing.')
 +faqItem('What is included in Premium?','PDF reports, price alerts, unlimited holdings and priority support, with a 7-day free trial.')
 +'</div>';}
function landCard(e,t,d){return '<div class="add-box" style="margin:0"><div style="font-size:24px">'+e+'</div><h3 style="margin:6px 0 4px">'+t+'</h3><div class="note">'+d+'</div></div>';}

function footer(){
  return '<div style="max-width:1000px;margin:26px auto 0;padding-top:14px;border-top:1px solid var(--line);text-align:center;font-size:11px;color:var(--muted);line-height:1.8">'

}
function showLegal(which){legalView=which;renderLegalPage();window.scrollTo(0,0);}
function closeLegal(){legalView=null;if(myId)render();else renderLanding();window.scrollTo(0,0);}
function renderLegalPage(){
  document.getElementById('app').innerHTML='<div class="add-box" style="max-width:820px;margin:20px auto">'+legalContent(legalView)+'<div style="margin-top:18px"><span class="cancel-link" onclick="closeLegal()">← Back</span></div></div>'+footer();

if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js');}catch(e){}}
