<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Portfolio Bahi-Khata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0E1726;--surface:#16223A;--surface2:#1D2B47;--line:#27395C;--text:#E8EDF5;--muted:#8A9BB8;--brass:#C9A227;--brass-dim:#8f7522;--gain:#3DD68C;--loss:#F16C6C;--radius:14px;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--ink);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;padding:20px 16px 80px}
  .num{font-variant-numeric:tabular-nums}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;letter-spacing:-.01em}
  .wrap{max-width:1000px;margin:0 auto}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
  header h1{font-size:22px}header h1 .dot{color:var(--brass)}
  .ver{font-size:12px;color:var(--brass);border:1px solid var(--brass-dim);padding:2px 9px;border-radius:20px;vertical-align:middle;font-family:'Space Grotesk',sans-serif}
  header .sub{color:var(--muted);font-size:13px}
  .refresh-btn{background:var(--brass);color:#1a1400;border:none;padding:9px 16px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:.15s}
  .refresh-btn:hover{filter:brightness(1.08)}.refresh-btn:disabled{opacity:.55;cursor:wait}
  .sec-btn{background:var(--surface2);color:var(--text);border:1px solid var(--line);padding:9px 14px;border-radius:10px;font-weight:600;font-size:13px;cursor:pointer;font-family:'Space Grotesk',sans-serif}
  .sec-btn:hover{border-color:var(--brass);color:var(--brass)}
  .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .card .lbl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
  .card .big{font-size:24px;font-weight:700;font-family:'Space Grotesk',sans-serif}
  .card .sm{font-size:12px;margin-top:4px}
  .pl-strip{background:linear-gradient(135deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px}
  .pl-strip .net{font-size:34px;font-weight:700;font-family:'Space Grotesk',sans-serif}
  .pl-strip .net-lbl{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
  .breakdown{display:flex;gap:22px;flex-wrap:wrap}.breakdown div{font-size:12px;color:var(--muted)}
  .breakdown b{display:block;font-size:16px;color:var(--text);font-family:'Space Grotesk',sans-serif;margin-top:2px}
  .gain{color:var(--gain)}.loss{color:var(--loss)}
  .tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line)}
  .tab{background:none;border:none;color:var(--muted);padding:10px 16px;cursor:pointer;font-size:14px;font-weight:600;font-family:'Space Grotesk',sans-serif;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.active{color:var(--brass);border-bottom-color:var(--brass)}
  .panel{display:none}.panel.active{display:block}
  .tbl{width:100%;border-collapse:collapse;font-size:13px}
  .tbl th{text-align:right;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--line)}
  .tbl th:first-child,.tbl td:first-child{text-align:left}
  .tbl td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
  .tbl tr:hover td{background:rgba(255,255,255,.02)}
  .tbl .name{font-weight:600}.tbl .tag{color:var(--muted);font-size:11px;display:block}
  .edit,.del{background:none;border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:4px 9px;cursor:pointer;font-size:12px}
  .edit{margin-right:4px}.edit:hover{border-color:var(--brass);color:var(--brass)}
  .del:hover{border-color:var(--loss);color:var(--loss)}
  .price-in{width:90px;background:var(--ink);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:5px 7px;text-align:right;font-size:13px;font-variant-numeric:tabular-nums}
  .empty{color:var(--muted);text-align:center;padding:30px;font-size:14px}
  .add-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:16px}
  .add-box h3{font-size:14px;margin-bottom:12px;color:var(--brass)}
  .cancel-link{color:var(--muted);font-size:12px;cursor:pointer;margin-left:12px;text-decoration:underline}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .fld{display:flex;flex-direction:column;gap:5px}
  .fld label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .fld input,.fld select{background:var(--ink);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit}
  .fld input:focus,.fld select:focus{outline:none;border-color:var(--brass)}
  .add-btn{background:var(--surface2);color:var(--text);border:1px solid var(--brass-dim);padding:9px 18px;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px;font-family:'Space Grotesk',sans-serif}
  .add-btn:hover{background:var(--brass);color:#1a1400}
  .search-results{position:absolute;background:var(--surface2);border:1px solid var(--line);border-radius:8px;margin-top:2px;max-height:220px;overflow:auto;z-index:20;width:340px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
  .search-results div{padding:9px 12px;cursor:pointer;font-size:12px;border-bottom:1px solid var(--line)}
  .search-results div:hover{background:var(--brass);color:#1a1400}
  .srch-wrap{position:relative}
  .note{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5}
  .loading{color:var(--muted);font-size:13px;padding:20px;text-align:center}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--brass-dim);color:var(--text);padding:11px 20px;border-radius:10px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:50}
  .toast.show{opacity:1}
  @media(max-width:720px){.summary{grid-template-columns:repeat(2,1fr)}.pl-strip .net{font-size:26px}.tbl{font-size:12px}.tbl th:nth-child(3),.tbl td:nth-child(3){display:none}body{padding:14px 10px 80px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Portfolio Bahi-Khata<span class="dot">.</span> <span class="ver">v6</span></h1>
      <div class="sub">Stocks · Mutual Funds · Interest / Loans — sab ek jagah</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <button class="sec-btn" onclick="exportData()">⬇ Backup</button>
      <label class="sec-btn" style="cursor:pointer">⬆ Restore<input type="file" accept="application/json" style="display:none" onchange="importData(this)"></label>
      <button class="refresh-btn" id="refreshBtn" onclick="refreshAll()">↻ Live Rates Update</button>
    </div>
  </header>
  <div id="app"><div class="loading">Data load ho raha hai…</div></div>
</div>
<div class="toast" id="toast"></div>

<script>
let state={stocks:[],mfs:[],loans:[]};
let activeTab='stocks';
let editStock=null, editMf=null, editLoan=null;
let loanMode='simple';
const KEY='portfolio-bahikhata-v1';
function loadState(){try{const raw=localStorage.getItem(KEY);if(raw)state=JSON.parse(raw);}catch(e){}state.stocks=state.stocks||[];state.mfs=state.mfs||[];state.loans=state.loans||[];}
function saveState(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){toast('Save nahi ho paya');}}

const inr=n=>'₹'+(isFinite(n)?Math.round(n).toLocaleString('en-IN'):'0');
const inr2=n=>'₹'+(isFinite(n)?n.toLocaleString('en-IN',{maximumFractionDigits:2}):'0');
const uid=()=>Math.random().toString(36).slice(2,9);
const plClass=n=>n>=0?'gain':'loss';
const plSign=n=>(n>=0?'+':'');
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800);}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function attr(s){return String(s==null?'':s).replace(/"/g,'&quot;');}
function yearsBetween(d){if(!d)return 0;return Math.max(0,(new Date()-new Date(d))/(1000*60*60*24*365.25));}
function daysBetween(d){if(!d)return 0;return Math.max(0,Math.floor((new Date()-new Date(d))/(1000*60*60*24)));}
function monthsBetween(d){if(!d)return 0;const s=new Date(d),n=new Date();let m=(n.getFullYear()-s.getFullYear())*12+(n.getMonth()-s.getMonth());if(n.getDate()<s.getDate())m--;return Math.max(0,m);}

function loanInterest(l){
  const P=+l.principal||0;
  if(l.mode==='fixed'){
    const tot=+l.months||0, ma=+l.monthlyAmount||0;
    const elapsed=Math.min(tot,monthsBetween(l.startDate));
    return {mode:'fixed',interest:elapsed*ma,totalInterest:tot*ma,total:P+tot*ma,elapsed,months:tot,monthly:ma,remaining:Math.max(0,tot-elapsed),days:daysBetween(l.startDate)};
  }
  const r=(+l.rate||0)/100,t=yearsBetween(l.startDate);
  let amt;
  if(l.type==='simple')amt=P*(1+r*t);
  else{const n=l.type==='monthly'?12:l.type==='quarterly'?4:1;amt=P*Math.pow(1+r/n,n*t);}
  return {mode:'accrue',interest:amt-P,total:amt,days:daysBetween(l.startDate)};
}

async function fetchMfNav(code){const r=await fetch('/api/mf?code='+encodeURIComponent(code));const j=await r.json();if(isFinite(j.nav))return j.nav;throw new Error('no nav');}
async function fetchStockPrice(symbol,exch){const r=await fetch('/api/stock?symbol='+encodeURIComponent(symbol)+'&exch='+exch);const j=await r.json();if(isFinite(j.price))return j.price;throw new Error('no price');}

async function refreshAll(){
  const btn=document.getElementById('refreshBtn');btn.disabled=true;btn.textContent='↻ Update ho raha hai…';
  let mfOk=0,stkOk=0,stkFail=0;
  for(const m of state.mfs){if(m.schemeCode){try{m.currentNav=await fetchMfNav(m.schemeCode);mfOk++;}catch(e){}}}
  for(const s of state.stocks){try{s.currentPrice=await fetchStockPrice(s.symbol,s.exch);s.auto=true;stkOk++;}catch(e){s.auto=false;stkFail++;}}
  saveState();render();btn.disabled=false;btn.textContent='↻ Live Rates Update';
  let msg='MF: '+mfOk+'/'+state.mfs.filter(m=>m.schemeCode).length;
  if(state.stocks.length)msg+=' · Stocks: '+stkOk+'/'+state.stocks.length+(stkFail?' ('+stkFail+' manual)':'');
  toast(msg);
}

function totals(){
  let sInv=0,sCur=0,mInv=0,mCur=0,lPrin=0,lInt=0;
  state.stocks.forEach(s=>{sInv+=s.qty*s.buyPrice;sCur+=s.qty*(s.currentPrice||s.buyPrice);});
  state.mfs.forEach(m=>{mInv+=m.units*m.buyNav;mCur+=m.units*(m.currentNav||m.buyNav);});
  state.loans.forEach(l=>{const c=loanInterest(l);lPrin+=(+l.principal||0);lInt+=c.interest;});
  const invested=sInv+mInv+lPrin,current=sCur+mCur+lPrin+lInt;
  return {sInv,sCur,mInv,mCur,lPrin,lInt,invested,current,net:current-invested,stockPL:sCur-sInv,mfPL:mCur-mInv};
}

function render(){
  const t=totals(),netPct=t.invested?(t.net/t.invested*100):0;
  document.getElementById('app').innerHTML=
    '<div class="pl-strip"><div><div class="net-lbl">Total Net Profit / Loss</div>'
    +'<div class="net '+plClass(t.net)+'">'+plSign(t.net)+inr(t.net)+' <span style="font-size:16px">('+plSign(netPct)+netPct.toFixed(2)+'%)</span></div></div>'
    +'<div class="breakdown"><div>Invested<b class="num">'+inr(t.invested)+'</b></div><div>Current Value<b class="num">'+inr(t.current)+'</b></div></div></div>'
    +'<div class="summary">'
    +'<div class="card"><div class="lbl">Stocks</div><div class="big num">'+inr(t.sCur)+'</div><div class="sm num '+plClass(t.stockPL)+'">'+plSign(t.stockPL)+inr(t.stockPL)+'</div></div>'
    +'<div class="card"><div class="lbl">Mutual Funds</div><div class="big num">'+inr(t.mCur)+'</div><div class="sm num '+plClass(t.mfPL)+'">'+plSign(t.mfPL)+inr(t.mfPL)+'</div></div>'
    +'<div class="card"><div class="lbl">Loan Principal</div><div class="big num">'+inr(t.lPrin)+'</div><div class="sm" style="color:var(--muted)">diya hua</div></div>'
    +'<div class="card"><div class="lbl">Interest Earned</div><div class="big num gain">'+inr(t.lInt)+'</div><div class="sm" style="color:var(--muted)">aaj tak</div></div></div>'
    +'<div class="tabs">'+tabBtn('stocks','Stocks')+tabBtn('mfs','Mutual Funds')+tabBtn('loans','Loans / Interest')+'</div>'
    +'<div class="panel '+(activeTab==='stocks'?'active':'')+'">'+renderStocks()+'</div>'
    +'<div class="panel '+(activeTab==='mfs'?'active':'')+'">'+renderMfs()+'</div>'
    +'<div class="panel '+(activeTab==='loans'?'active':'')+'">'+renderLoans()+'</div>';
}
function tabBtn(id,label){return '<button class="tab '+(activeTab===id?'active':'')+'" onclick="switchTab(\''+id+'\')">'+label+'</button>';}
function switchTab(id){activeTab=id;editStock=editMf=editLoan=null;render();}

/* ---------- STOCKS ---------- */
function renderStocks(){
  const rows=state.stocks.map(s=>{
    const inv=s.qty*s.buyPrice,cur=s.qty*(s.currentPrice||s.buyPrice),pl=cur-inv,pct=inv?(pl/inv*100):0;
    return '<tr><td><span class="name">'+escapeHtml(s.symbol)+'</span><span class="tag">'+s.exch+' · '+s.qty+' qty · '+(s.auto?'live':'manual')+'</span></td>'
      +'<td class="num">'+inr2(s.buyPrice)+'</td>'
      +'<td class="num"><input class="price-in num" type="number" step="0.01" value="'+(s.currentPrice||s.buyPrice)+'" onchange="setStockPrice(\''+s.id+'\',this.value)"></td>'
      +'<td class="num">'+inr(inv)+'</td><td class="num">'+inr(cur)+'</td>'
      +'<td class="num '+plClass(pl)+'">'+plSign(pl)+inr(pl)+'<br><span style="font-size:11px">'+plSign(pct)+pct.toFixed(1)+'%</span></td>'
      +'<td><button class="edit" onclick="startEditStock(\''+s.id+'\')">✎</button><button class="del" onclick="delItem(\'stocks\',\''+s.id+'\')">✕</button></td></tr>';
  }).join('');
  const e=editStock?state.stocks.find(x=>x.id===editStock):null;
  return '<table class="tbl"><thead><tr><th>Stock</th><th>Buy Price</th><th>Current</th><th>Invested</th><th>Value</th><th>P/L</th><th></th></tr></thead>'
    +'<tbody>'+(rows||'<tr><td colspan="7" class="empty">Abhi koi stock nahi. Neeche add karein.</td></tr>')+'</tbody></table>'
    +'<div class="add-box"><h3>'+(e?'✎ Stock Edit karein':'+ Naya Stock Add karein')+(e?'<span class="cancel-link" onclick="cancelEdit()">cancel</span>':'')+'</h3>'
    +(e?'':'<div class="row"><div class="fld srch-wrap"><label>Naam se search (live)</label><input id="stk-search" placeholder="jaise: Reliance, TCS" style="width:340px" oninput="stockSearch(this.value)" autocomplete="off"><div id="stk-results"></div></div></div>'
    +'<div class="note" style="margin:6px 0 0">Search se chunein, ya niche Symbol khud daalein.</div>')
    +'<div class="row" style="margin-top:12px">'
    +'<div class="fld"><label>Symbol</label><input id="stk-sym" placeholder="RELIANCE" value="'+(e?attr(e.symbol):'')+'" style="width:130px"></div>'
    +'<div class="fld"><label>Exchange</label><select id="stk-exch"><option'+(e&&e.exch==='NSE'?' selected':'')+'>NSE</option><option'+(e&&e.exch==='BSE'?' selected':'')+'>BSE</option></select></div>'
    +'<div class="fld"><label>Quantity</label><input id="stk-qty" type="number" value="'+(e?e.qty:'')+'" placeholder="10" style="width:90px"></div>'
    +'<div class="fld"><label>Buy Price (₹)</label><input id="stk-bp" type="number" step="0.01" value="'+(e?e.buyPrice:'')+'" placeholder="1200" style="width:110px"></div>'
    +'<div class="fld"><label>Buy Date</label><input id="stk-dt" type="date" value="'+(e?attr(e.buyDate):'')+'"></div>'
    +'<button class="add-btn" onclick="saveStock()">'+(e?'Save':'Add')+'</button></div>'
    +'<div class="note">"Live Rates Update" dabate hi aaj ka price aa jayega.</div></div>';
}
const STOCKS=[
{n:'Reliance Industries',s:'RELIANCE'},{n:'Tata Consultancy Services (TCS)',s:'TCS'},{n:'HDFC Bank',s:'HDFCBANK'},{n:'ICICI Bank',s:'ICICIBANK'},{n:'Infosys',s:'INFY'},{n:'Hindustan Unilever (HUL)',s:'HINDUNILVR'},{n:'State Bank of India (SBI)',s:'SBIN'},{n:'Bharti Airtel',s:'BHARTIARTL'},{n:'ITC',s:'ITC'},{n:'Kotak Mahindra Bank',s:'KOTAKBANK'},{n:'Larsen & Toubro (L&T)',s:'LT'},{n:'Axis Bank',s:'AXISBANK'},{n:'Bajaj Finance',s:'BAJFINANCE'},{n:'Bajaj Finserv',s:'BAJAJFINSV'},{n:'Asian Paints',s:'ASIANPAINT'},{n:'Maruti Suzuki',s:'MARUTI'},{n:'HCL Technologies',s:'HCLTECH'},{n:'Sun Pharmaceutical',s:'SUNPHARMA'},{n:'Titan Company',s:'TITAN'},{n:'Wipro',s:'WIPRO'},{n:'UltraTech Cement',s:'ULTRACEMCO'},{n:'Nestle India',s:'NESTLEIND'},{n:'Power Grid',s:'POWERGRID'},{n:'NTPC',s:'NTPC'},{n:'Tata Motors',s:'TATAMOTORS'},{n:'Tata Steel',s:'TATASTEEL'},{n:'JSW Steel',s:'JSWSTEEL'},{n:'Mahindra & Mahindra (M&M)',s:'M&M'},{n:'IndusInd Bank',s:'INDUSINDBK'},{n:'Adani Enterprises',s:'ADANIENT'},{n:'Adani Ports',s:'ADANIPORTS'},{n:'Adani Green Energy',s:'ADANIGREEN'},{n:'Adani Power',s:'ADANIPOWER'},{n:'HDFC Life Insurance',s:'HDFCLIFE'},{n:'HDFC AMC',s:'HDFCAMC'},{n:'SBI Life Insurance',s:'SBILIFE'},{n:'Bajaj Auto',s:'BAJAJ-AUTO'},{n:'Hero MotoCorp',s:'HEROMOTOCO'},{n:'Eicher Motors',s:'EICHERMOT'},{n:'Britannia Industries',s:'BRITANNIA'},{n:"Divi's Laboratories",s:'DIVISLAB'},{n:"Dr Reddy's Labs",s:'DRREDDY'},{n:'Cipla',s:'CIPLA'},{n:'Grasim Industries',s:'GRASIM'},{n:'Coal India',s:'COALINDIA'},{n:'ONGC',s:'ONGC'},{n:'Indian Oil (IOC)',s:'IOC'},{n:'BPCL',s:'BPCL'},{n:'GAIL India',s:'GAIL'},{n:'Tech Mahindra',s:'TECHM'},{n:'Shree Cement',s:'SHREECEM'},{n:'Pidilite Industries',s:'PIDILITIND'},{n:'Dabur India',s:'DABUR'},{n:'Godrej Consumer',s:'GODREJCP'},{n:'Avenue Supermarts (DMart)',s:'DMART'},{n:'One97 (Paytm)',s:'PAYTM'},{n:'FSN E-Commerce (Nykaa)',s:'NYKAA'},{n:'Vedanta',s:'VEDL'},{n:'Hindalco Industries',s:'HINDALCO'},{n:'LTIMindtree',s:'LTIM'},{n:'SBI Cards',s:'SBICARD'},{n:'Bank of Baroda',s:'BANKBARODA'},{n:'Punjab National Bank (PNB)',s:'PNB'},{n:'Canara Bank',s:'CANBK'},{n:'InterGlobe (IndiGo)',s:'INDIGO'},{n:'DLF',s:'DLF'},{n:'Ambuja Cements',s:'AMBUJACEM'},{n:'ACC',s:'ACC'},{n:'Havells India',s:'HAVELLS'},{n:'Siemens',s:'SIEMENS'},{n:'ABB India',s:'ABB'},{n:'Bosch',s:'BOSCHLTD'},{n:'Berger Paints',s:'BERGEPAINT'},{n:'Marico',s:'MARICO'},{n:'Colgate-Palmolive',s:'COLPAL'},{n:'Trent',s:'TRENT'},{n:'Bharat Electronics (BEL)',s:'BEL'},{n:'Hindustan Aeronautics (HAL)',s:'HAL'},{n:'Bharat Forge',s:'BHARATFORG'},{n:'Page Industries',s:'PAGEIND'},{n:'Muthoot Finance',s:'MUTHOOTFIN'},{n:'Cholamandalam Finance',s:'CHOLAFIN'},{n:'ICICI Prudential Life',s:'ICICIPRULI'},{n:'ICICI Lombard',s:'ICICIGI'},{n:'Yes Bank',s:'YESBANK'},{n:'IDFC First Bank',s:'IDFCFIRSTB'},{n:'Federal Bank',s:'FEDERALBNK'},{n:'Tata Power',s:'TATAPOWER'},{n:'Tata Consumer Products',s:'TATACONSUM'},{n:'Apollo Hospitals',s:'APOLLOHOSP'},{n:'Max Healthcare',s:'MAXHEALTH'},{n:'Lupin',s:'LUPIN'},{n:'Aurobindo Pharma',s:'AUROPHARMA'},{n:'Torrent Pharma',s:'TORNTPHARM'},{n:'Biocon',s:'BIOCON'},{n:'Samvardhana Motherson',s:'MOTHERSON'},{n:'Jindal Steel & Power',s:'JINDALSTEL'},{n:'SAIL',s:'SAIL'},{n:'NMDC',s:'NMDC'},{n:'Container Corp (CONCOR)',s:'CONCOR'},{n:'Petronet LNG',s:'PETRONET'},{n:'Indian Railway Finance (IRFC)',s:'IRFC'},{n:'IRCTC',s:'IRCTC'},{n:'REC',s:'RECLTD'},{n:'Power Finance (PFC)',s:'PFC'},{n:'LIC',s:'LICI'},{n:'Zydus Lifesciences',s:'ZYDUSLIFE'},{n:'Persistent Systems',s:'PERSISTENT'},{n:'Coforge',s:'COFORGE'},{n:'Mphasis',s:'MPHASIS'},{n:'Polycab India',s:'POLYCAB'},{n:'Astral',s:'ASTRAL'},{n:'Balkrishna Industries',s:'BALKRISIND'}
];
let stockSel=null,stockTimer=null,stockResults=[];
function localStockMatch(q){
  const toks=q.toLowerCase().split(/\s+/).filter(Boolean);
  return STOCKS.filter(x=>{const hay=(x.n+' '+x.s).toLowerCase();return toks.every(t=>hay.includes(t));}).map(x=>({symbol:x.s,exch:'NSE',name:x.n}));
}
function renderStockResults(list){
  const box=document.getElementById('stk-results');if(!box)return;
  if(!list.length){box.innerHTML='<div class="search-results"><div style="cursor:default;color:var(--muted)">Nahi mila — niche Symbol khud daalein</div></div>';return;}
  stockResults=list.slice(0,30);
  box.innerHTML='<div class="search-results">'+stockResults.map((x,i)=>'<div data-i="'+i+'">'+escapeHtml(x.name)+' <span style="color:var(--muted)">· '+x.symbol+' ('+x.exch+')</span></div>').join('')+'</div>';
  box.querySelectorAll('[data-i]').forEach(el=>el.addEventListener('click',()=>{const x=stockResults[+el.dataset.i];pickStock(x.symbol,x.exch);}));
}
function stockSearch(q){
  clearTimeout(stockTimer);q=q.trim();const box=document.getElementById('stk-results');
  if(q.length<2){box.innerHTML='';return;}
  const local=localStockMatch(q);
  renderStockResults(local);
  stockTimer=setTimeout(async()=>{
    try{const res=await fetch('/api/stock-search?q='+encodeURIComponent(q));
      if(res.ok){const j=await res.json();if(Array.isArray(j)&&j.length){
        const seen=new Set(local.map(x=>x.symbol));
        renderStockResults(local.concat(j.filter(x=>!seen.has(x.symbol))));
      }}
    }catch(e){}
  },300);
}
function pickStock(sym,exch){document.getElementById('stk-sym').value=sym;document.getElementById('stk-exch').value=exch;document.getElementById('stk-results').innerHTML='';document.getElementById('stk-search').value=sym;}
function startEditStock(id){editStock=id;editMf=editLoan=null;render();}
async function saveStock(){
  const sym=document.getElementById('stk-sym').value.trim().toUpperCase();
  const exch=document.getElementById('stk-exch').value;
  const qty=+document.getElementById('stk-qty').value,bp=+document.getElementById('stk-bp').value;
  const dt=document.getElementById('stk-dt').value;
  if(!sym||!qty||!bp){toast('Symbol, quantity aur buy price bharein');return;}
  if(editStock){const s=state.stocks.find(x=>x.id===editStock);Object.assign(s,{symbol:sym,exch,qty,buyPrice:bp,buyDate:dt});editStock=null;saveState();render();toast('Stock update ho gaya');try{s.currentPrice=await fetchStockPrice(sym,exch);s.auto=true;saveState();render();}catch(e){}return;}
  const s={id:uid(),symbol:sym,exch,qty,buyPrice:bp,buyDate:dt,currentPrice:bp,auto:false};
  state.stocks.push(s);saveState();render();
  try{s.currentPrice=await fetchStockPrice(sym,exch);s.auto=true;saveState();render();toast('Live price: '+inr2(s.currentPrice));}catch(e){toast(sym+' ka live price abhi nahi aaya — Current me haath se daalein');}
}
function setStockPrice(id,v){const s=state.stocks.find(x=>x.id===id);if(s){s.currentPrice=+v;s.auto=false;saveState();render();}}

/* ---------- MUTUAL FUNDS ---------- */
function renderMfs(){
  const rows=state.mfs.map(m=>{
    const inv=m.units*m.buyNav,cur=m.units*(m.currentNav||m.buyNav),pl=cur-inv,pct=inv?(pl/inv*100):0;
    return '<tr><td><span class="name">'+escapeHtml(m.name)+'</span><span class="tag">'+m.units+' units'+(m.schemeCode?' · code '+m.schemeCode:' · manual')+'</span></td>'
      +'<td class="num">'+inr2(m.buyNav)+'</td>'
      +'<td class="num"><input class="price-in num" type="number" step="0.01" value="'+(m.currentNav||m.buyNav)+'" onchange="setMfNav(\''+m.id+'\',this.value)"></td>'
      +'<td class="num">'+inr(inv)+'</td><td class="num">'+inr(cur)+'</td>'
      +'<td class="num '+plClass(pl)+'">'+plSign(pl)+inr(pl)+'<br><span style="font-size:11px">'+plSign(pct)+pct.toFixed(1)+'%</span></td>'
      +'<td><button class="edit" onclick="startEditMf(\''+m.id+'\')">✎</button><button class="del" onclick="delItem(\'mfs\',\''+m.id+'\')">✕</button></td></tr>';
  }).join('');
  const e=editMf?state.mfs.find(x=>x.id===editMf):null;
  return '<table class="tbl"><thead><tr><th>Fund</th><th>Buy NAV</th><th>Current NAV</th><th>Invested</th><th>Value</th><th>P/L</th><th></th></tr></thead>'
    +'<tbody>'+(rows||'<tr><td colspan="7" class="empty">Abhi koi mutual fund nahi. Neeche add karein.</td></tr>')+'</tbody></table>'
    +'<div class="add-box"><h3>'+(e?'✎ Fund Edit karein':'+ Naya Mutual Fund Add karein')+(e?'<span class="cancel-link" onclick="cancelEdit()">cancel</span>':'')+'</h3>'
    +(e?'':'<div class="row"><div class="fld srch-wrap"><label>Fund search (live)</label><input id="mf-search" placeholder="jaise: HDFC Flexi Cap Direct Growth" style="width:360px" oninput="mfSearch(this.value)" autocomplete="off"><div id="mf-results"></div></div></div>'
    +'<div class="note" style="margin:6px 0 0">Search se chunein to live NAV auto aayega. Ya naam khud type karke NAV manual daalein.</div>')
    +'<div class="row" style="margin-top:12px">'
    +'<div class="fld"><label>Fund ka naam</label><input id="mf-name" value="'+(e?attr(e.name):'')+'" placeholder="upar se chunein ya type karein" style="width:340px;color:var(--brass)"></div>'
    +'<div class="fld"><label>Units</label><input id="mf-units" type="number" step="0.001" value="'+(e?e.units:'')+'" placeholder="150.5" style="width:100px"></div>'
    +'<div class="fld"><label>Buy NAV (₹)</label><input id="mf-nav" type="number" step="0.01" value="'+(e?e.buyNav:'')+'" placeholder="45.20" style="width:100px"></div>'
    +'<div class="fld"><label>Current NAV (₹)</label><input id="mf-curnav" type="number" step="0.01" value="'+(e&&e.currentNav?e.currentNav:'')+'" placeholder="optional" style="width:100px"></div>'
    +'<div class="fld"><label>Buy Date</label><input id="mf-dt" type="date" value="'+(e?attr(e.buyDate):'')+'"></div>'
    +'<button class="add-btn" onclick="saveMf()">'+(e?'Save':'Add')+'</button></div></div>';
}
let mfSel=null,mfTimer=null,mfResults=[];
function mfMsg(t){document.getElementById('mf-results').innerHTML='<div class="search-results"><div style="cursor:default;color:var(--muted)">'+t+'</div></div>';}
function mfSearch(q){
  clearTimeout(mfTimer);q=q.trim();const box=document.getElementById('mf-results');
  if(q.length<3){box.innerHTML='';return;}
  mfMsg('Dhoond rahe hain…');
  mfTimer=setTimeout(async()=>{
    let r=[];try{const res=await fetch('/api/mf-search?q='+encodeURIComponent(q));if(res.ok){const j=await res.json();if(Array.isArray(j))r=j;}}catch(e){mfMsg('Search abhi nahi chala — naam khud type karke NAV daalein');return;}
    mfResults=r.slice(0,40);
    if(!mfResults.length){mfMsg('Koi fund nahi mila — doosre shabd try karein');return;}
    box.innerHTML='<div class="search-results">'+mfResults.map((x,i)=>'<div data-i="'+i+'">'+escapeHtml(x.schemeName)+'</div>').join('')+'</div>';
    box.querySelectorAll('[data-i]').forEach(el=>el.addEventListener('click',()=>{const x=mfResults[+el.dataset.i];pickMf(x.schemeCode,x.schemeName);}));
  },300);
}
function pickMf(code,name){mfSel={code,name};document.getElementById('mf-name').value=name;document.getElementById('mf-results').innerHTML='';document.getElementById('mf-search').value=name;}
function startEditMf(id){editMf=id;editStock=editLoan=null;render();}
async function saveMf(){
  const name=document.getElementById('mf-name').value.trim();
  const units=+document.getElementById('mf-units').value,nav=+document.getElementById('mf-nav').value,curnav=+document.getElementById('mf-curnav').value;
  if(!name){toast('Fund ka naam chunein ya type karein');return;}
  if(!units||!nav){toast('Units aur buy NAV bharein');return;}
  const dt=document.getElementById('mf-dt').value;
  if(editMf){const m=state.mfs.find(x=>x.id===editMf);const code=(mfSel&&mfSel.name===name)?mfSel.code:m.schemeCode;Object.assign(m,{name,units,buyNav:nav,buyDate:dt,schemeCode:code});if(curnav)m.currentNav=curnav;editMf=null;saveState();render();toast('Fund update ho gaya');if(code&&!curnav){try{m.currentNav=await fetchMfNav(code);saveState();render();}catch(e){}}mfSel=null;return;}
  const code=(mfSel&&mfSel.name===name)?mfSel.code:null;
  const m={id:uid(),schemeCode:code,name,units,buyNav:nav,buyDate:dt,currentNav:curnav||null};
  state.mfs.push(m);saveState();render();
  if(code){try{m.currentNav=await fetchMfNav(code);saveState();render();toast('Live NAV: '+inr2(m.currentNav));}catch(e){if(!curnav)toast('Live NAV abhi nahi aaya — "Live Rates Update" dabayein');}}
  mfSel=null;
}
function setMfNav(id,v){const m=state.mfs.find(x=>x.id===id);if(m){m.currentNav=+v;saveState();render();}}

/* ---------- LOANS ---------- */
function renderLoans(){
  const rows=state.loans.map(l=>{
    const c=loanInterest(l);
    if(c.mode==='fixed'){
      return '<tr><td><span class="name">'+escapeHtml(l.borrower)+'</span><span class="tag">'+inr(c.monthly)+'/mahina × '+c.months+' · '+c.elapsed+'/'+c.months+' mahine mila · principal wapas '+inr(l.principal)+(l.note?' · '+escapeHtml(l.note):'')+'</span></td>'
        +'<td class="num">'+inr(l.principal)+'</td><td class="num gain">'+inr(c.interest)+'</td><td class="num">'+inr(l.principal+c.totalInterest)+'</td>'
        +'<td><button class="edit" onclick="startEditLoan(\''+l.id+'\')">✎</button><button class="del" onclick="delItem(\'loans\',\''+l.id+'\')">✕</button></td></tr>';
    }
    const tl=l.type==='simple'?'Simple':(l.type==='monthly'?'Monthly comp.':l.type==='quarterly'?'Quarterly comp.':'Yearly comp.');
    return '<tr><td><span class="name">'+escapeHtml(l.borrower)+'</span><span class="tag">'+l.rate+'% p.a. · '+tl+' · '+c.days+' din'+(l.note?' · '+escapeHtml(l.note):'')+'</span></td>'
      +'<td class="num">'+inr(l.principal)+'</td><td class="num gain">'+inr(c.interest)+'</td><td class="num">'+inr(c.total)+'</td>'
      +'<td><button class="edit" onclick="startEditLoan(\''+l.id+'\')">✎</button><button class="del" onclick="delItem(\'loans\',\''+l.id+'\')">✕</button></td></tr>';
  }).join('');
  const e=editLoan?state.loans.find(x=>x.id===editLoan):null;
  const isFixed=loanMode==='fixed',isComp=loanMode==='compound';
  let fields='';
  if(isFixed){
    fields='<div class="fld"><label>Har mahine milta hai (₹)</label><input id="ln-monthly" type="number" value="'+(e&&e.mode==="fixed"?e.monthlyAmount:'')+'" placeholder="2250" style="width:130px"></div>'
      +'<div class="fld"><label>Kitne mahine</label><input id="ln-months" type="number" value="'+(e&&e.mode==="fixed"?e.months:'')+'" placeholder="12" style="width:110px"></div>';
  }else{
    fields='<div class="fld"><label>Byaaj % (saalana)</label><input id="ln-rate" type="number" step="0.1" value="'+(e&&e.mode!=="fixed"?e.rate:'')+'" placeholder="18" style="width:110px"></div>';
    if(isComp)fields+='<div class="fld"><label>Compound kab</label><select id="ln-freq"><option value="monthly"'+(e&&e.type==='monthly'?' selected':'')+'>Monthly</option><option value="quarterly"'+(e&&e.type==='quarterly'?' selected':'')+'>Quarterly</option><option value="yearly"'+(e&&e.type==='yearly'?' selected':'')+'>Yearly</option></select></div>';
  }
  return '<table class="tbl"><thead><tr><th>Kisko diya</th><th>Principal</th><th>Interest (aaj tak)</th><th>Total milega</th><th></th></tr></thead>'
    +'<tbody>'+(rows||'<tr><td colspan="5" class="empty">Abhi koi loan entry nahi. Neeche add karein.</td></tr>')+'</tbody></table>'
    +'<div class="add-box"><h3>'+(e?'✎ Loan Edit karein':'+ Naya Loan / Udhaar Add karein')+(e?'<span class="cancel-link" onclick="cancelEdit()">cancel</span>':'')+'</h3>'
    +'<div class="row">'
    +'<div class="fld"><label>Tarika</label><select id="ln-mode" onchange="loanMode=this.value;render()">'
    +'<option value="simple"'+(loanMode==='simple'?' selected':'')+'>Byaaj — Simple</option>'
    +'<option value="compound"'+(loanMode==='compound'?' selected':'')+'>Byaaj — Compound</option>'
    +'<option value="fixed"'+(loanMode==='fixed'?' selected':'')+'>Fixed monthly (fix rakam/mahina)</option></select></div>'
    +'<div class="fld"><label>Kisko diya (naam)</label><input id="ln-name" value="'+(e?attr(e.borrower):'')+'" placeholder="Ramesh ji" style="width:150px"></div>'
    +'<div class="fld"><label>Rakam / Principal (₹)</label><input id="ln-amt" type="number" value="'+(e?e.principal:'')+'" placeholder="30000" style="width:120px"></div>'
    +fields
    +'<div class="fld"><label>Kab diya</label><input id="ln-dt" type="date" value="'+(e?attr(e.startDate):'')+'"></div>'
    +'<div class="fld"><label>Note (optional)</label><input id="ln-note" value="'+(e?attr(e.note):'')+'" placeholder="cash / cheque" style="width:120px"></div>'
    +'<button class="add-btn" onclick="saveLoan()">'+(e?'Save':'Add')+'</button></div>'
    +'<div class="note">'+(isFixed?'Jaise: ₹30,000 diya, har mahine ₹2,250 milta hai 12 mahine tak, phir principal wapas.':'Byaaj aaj ki tareekh tak apne-aap judta rehta hai.')+'</div></div>';
}
function startEditLoan(id){editLoan=id;editStock=editMf=null;const l=state.loans.find(x=>x.id===id);loanMode=l.mode==='fixed'?'fixed':(l.type==='simple'?'simple':'compound');render();}
function saveLoan(){
  const name=document.getElementById('ln-name').value.trim();
  const amt=+document.getElementById('ln-amt').value;
  const dt=document.getElementById('ln-dt').value;
  const note=document.getElementById('ln-note').value.trim();
  if(!name||!amt||!dt){toast('Naam, rakam aur date bharein');return;}
  let obj;
  if(loanMode==='fixed'){
    const ma=+document.getElementById('ln-monthly').value,mo=+document.getElementById('ln-months').value;
    if(!ma||!mo){toast('Monthly rakam aur kitne mahine bharein');return;}
    obj={borrower:name,principal:amt,startDate:dt,note,mode:'fixed',monthlyAmount:ma,months:mo};
  }else{
    const rate=+document.getElementById('ln-rate').value;
    if(!rate){toast('Byaaj % bharein');return;}
    const type=loanMode==='compound'?document.getElementById('ln-freq').value:'simple';
    obj={borrower:name,principal:amt,startDate:dt,note,mode:'accrue',rate,type};
  }
  if(editLoan){const l=state.loans.find(x=>x.id===editLoan);['rate','type','monthlyAmount','months'].forEach(k=>delete l[k]);Object.assign(l,obj);editLoan=null;}
  else{obj.id=uid();state.loans.push(obj);}
  loanMode='simple';saveState();render();toast('Loan save ho gaya');
}

function cancelEdit(){editStock=editMf=editLoan=null;loanMode='simple';render();}
function delItem(kind,id){state[kind]=state[kind].filter(x=>x.id!==id);saveState();render();}

function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download='portfolio-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
  toast('Backup file download ho gayi');
}
function importData(input){
  const f=input.files&&input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);
    if(d&&(d.stocks||d.mfs||d.loans)){state={stocks:d.stocks||[],mfs:d.mfs||[],loans:d.loans||[]};saveState();render();toast('Backup restore ho gaya');}
    else toast('Ye sahi backup file nahi lagti');
  }catch(e){toast('File padhi nahi gayi');}};
  r.readAsText(f);input.value='';
}

loadState();render();
</script>
</body>
