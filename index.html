<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Portfolio Bahi-Khata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  :root{--ink:#0E1726;--surface:#16223A;--surface2:#1D2B47;--line:#27395C;--text:#E8EDF5;--muted:#8A9BB8;--brass:#C9A227;--brass-dim:#8f7522;--gain:#3DD68C;--loss:#F16C6C;--radius:14px;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--ink);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;padding:20px 16px 80px}
  .num{font-variant-numeric:tabular-nums}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;letter-spacing:-.01em}
  .wrap{max-width:1000px;margin:0 auto}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
  header h1{font-size:22px}header h1 .dot{color:var(--brass)}
  .ver{font-size:12px;color:var(--brass);border:1px solid var(--brass-dim);padding:2px 9px;border-radius:20px;vertical-align:middle;font-family:'Space Grotesk',sans-serif}
  header .sub{color:var(--muted);font-size:13px}
  .refresh-btn{background:var(--brass);color:#1a1400;border:none;padding:9px 16px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:.15s}
  .refresh-btn:hover{filter:brightness(1.08)}.refresh-btn:disabled{opacity:.55;cursor:wait}
  .sec-btn{background:var(--surface2);color:var(--text);border:1px solid var(--line);padding:9px 14px;border-radius:10px;font-weight:600;font-size:13px;cursor:pointer;font-family:'Space Grotesk',sans-serif}
  .sec-btn:hover{border-color:var(--brass);color:var(--brass)}
  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:14px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .card .lbl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
  .card .big{font-size:24px;font-weight:700;font-family:'Space Grotesk',sans-serif}
  .card .sm{font-size:12px;margin-top:4px}
  .pl-strip{background:linear-gradient(135deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px}
  .pl-strip .net{font-size:34px;font-weight:700;font-family:'Space Grotesk',sans-serif}
  .pl-strip .net-lbl{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
  .breakdown{display:flex;gap:22px;flex-wrap:wrap}.breakdown div{font-size:12px;color:var(--muted)}
  .breakdown b{display:block;font-size:16px;color:var(--text);font-family:'Space Grotesk',sans-serif;margin-top:2px}
  .gain{color:var(--gain)}.loss{color:var(--loss)}
  .tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line)}
  .tab{background:none;border:none;color:var(--muted);padding:10px 16px;cursor:pointer;font-size:14px;font-weight:600;font-family:'Space Grotesk',sans-serif;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.active{color:var(--brass);border-bottom-color:var(--brass)}
  .panel{display:none}.panel.active{display:block}
  .tbl{width:100%;border-collapse:collapse;font-size:13px}
  .tbl th{text-align:right;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--line)}
  .tbl th:first-child,.tbl td:first-child{text-align:left}
  .tbl td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
  .tbl tr:hover td{background:rgba(255,255,255,.02)}
  .tbl .name{font-weight:600}.tbl .tag{color:var(--muted);font-size:11px;display:block}
  .edit,.del{background:none;border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:4px 9px;cursor:pointer;font-size:12px}
  .edit{margin-right:4px}.edit:hover{border-color:var(--brass);color:var(--brass)}
  .del:hover{border-color:var(--loss);color:var(--loss)}
  .price-in{width:90px;background:var(--ink);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:5px 7px;text-align:right;font-size:13px;font-variant-numeric:tabular-nums}
  .empty{color:var(--muted);text-align:center;padding:30px;font-size:14px}
  .add-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:16px}
  .add-box h3{font-size:14px;margin-bottom:12px;color:var(--brass)}
  .cancel-link{color:var(--muted);font-size:12px;cursor:pointer;margin-left:12px;text-decoration:underline}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .fld{display:flex;flex-direction:column;gap:5px}
  .fld label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .fld input,.fld select{background:var(--ink);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit}
  .fld input:focus,.fld select:focus{outline:none;border-color:var(--brass)}
  .add-btn{background:var(--surface2);color:var(--text);border:1px solid var(--brass-dim);padding:9px 18px;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px;font-family:'Space Grotesk',sans-serif}
  .add-btn:hover{background:var(--brass);color:#1a1400}
  .search-results{position:absolute;background:var(--surface2);border:1px solid var(--line);border-radius:8px;margin-top:2px;max-height:220px;overflow:auto;z-index:20;width:340px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
  .search-results div{padding:9px 12px;cursor:pointer;font-size:12px;border-bottom:1px solid var(--line)}
  .search-results div:hover{background:var(--brass);color:#1a1400}
  .srch-wrap{position:relative}
  .note{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5}
  .loading{color:var(--muted);font-size:13px;padding:20px;text-align:center}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--brass-dim);color:var(--text);padding:11px 20px;border-radius:10px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:50}
  .toast.show{opacity:1}
  @media(max-width:720px){.summary{grid-template-columns:repeat(2,1fr)}.pl-strip .net{font-size:26px}.tbl{font-size:12px}.tbl th:nth-child(3),.tbl td:nth-child(3){display:none}body{padding:14px 10px 80px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Portfolio Bahi-Khata<span class="dot">.</span> <span class="ver">v12</span></h1>
      <div class="sub">Stocks · Mutual Funds · Interest / Loans — sab ek jagah</div>
    </div>
    <div id="hdrActions" style="display:none;gap:8px;align-items:center;flex-wrap:wrap">
      <label class="sec-btn" style="cursor:pointer"><input type="checkbox" id="autoChk" onchange="toggleAuto(this)" style="margin-right:6px;vertical-align:middle">Auto</label>
      <button class="sec-btn" onclick="exportData()">⬇ Backup</button>
      <label class="sec-btn" style="cursor:pointer">⬆ Restore<input type="file" accept="application/json" style="display:none" onchange="importData(this)"></label>
      <button class="refresh-btn" id="refreshBtn" onclick="refreshAll()">↻ Live Rates Update</button>
    </div>
  </header>
  <div id="app"><div class="loading">Data load ho raha hai…</div></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* Supabase ki values ab config.js me hain — is file me kuch nahi badalna. */
const SUPABASE_URL      = (window.SUPABASE_URL||'').trim();
const SUPABASE_ANON_KEY = (window.SUPABASE_ANON_KEY||'').trim();

let sb=null;
let state={stocks:[],mfs:[],loans:[],bonds:[]};
let activeTab='stocks';
let editStock=null, editMf=null, editLoan=null, editBond=null;
let loanMode='simple', bondMode='fixed';
let myId=null,myEmail='',myIsAdmin=false,viewingUserId=null,viewingEmail='',adminUsers=[];
let appSettings={},supportMsgs=[],supportConvos=[],supportOpenUser=null,supportChannel=null;
let saveTimer=null;
const KEY='portfolio-bahikhata-v1';
function normalize(){state.stocks=state.stocks||[];state.mfs=state.mfs||[];state.loans=state.loans||[];state.bonds=state.bonds||[];}
function saveState(){
  normalize();
  try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
  if(sb&&viewingUserId){
    clearTimeout(saveTimer);
    saveTimer=setTimeout(async()=>{
      const {error}=await sb.from('portfolios').upsert({user_id:viewingUserId,data:state,updated_at:new Date().toISOString()});
      if(error)toast('Cloud save fail: '+error.message);
    },600);
  }
}
async function loadPortfolio(uid){
  const {data,error}=await sb.from('portfolios').select('data').eq('user_id',uid).maybeSingle();
  if(error){toast('Load fail: '+error.message);state={stocks:[],mfs:[],loans:[],bonds:[]};}
  else{state=(data&&data.data)||{stocks:[],mfs:[],loans:[],bonds:[]};}
  normalize();
}

const inr=n=>'₹'+(isFinite(n)?Math.round(n).toLocaleString('en-IN'):'0');
const inr2=n=>'₹'+(isFinite(n)?n.toLocaleString('en-IN',{maximumFractionDigits:2}):'0');
const uid=()=>Math.random().toString(36).slice(2,9);
const plClass=n=>n>=0?'gain':'loss';
const plSign=n=>(n>=0?'+':'');
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800);}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function attr(s){return String(s==null?'':s).replace(/"/g,'&quot;');}
function yearsBetween(d){if(!d)return 0;return Math.max(0,(new Date()-new Date(d))/(1000*60*60*24*365.25));}
function daysBetween(d){if(!d)return 0;return Math.max(0,Math.floor((new Date()-new Date(d))/(1000*60*60*24)));}
function monthsBetween(d){if(!d)return 0;const s=new Date(d),n=new Date();let m=(n.getFullYear()-s.getFullYear())*12+(n.getMonth()-s.getMonth());if(n.getDate()<s.getDate())m--;return Math.max(0,m);}

function loanInterest(l){
  const P=+l.principal||0;
  if(l.mode==='fixed'){
    const tot=+l.months||0, ma=+l.monthlyAmount||0;
    const elapsed=Math.min(tot,monthsBetween(l.startDate));
    return {mode:'fixed',interest:elapsed*ma,totalInterest:tot*ma,total:P+tot*ma,elapsed,months:tot,monthly:ma,remaining:Math.max(0,tot-elapsed),days:daysBetween(l.startDate)};
  }
  const r=(+l.rate||0)/100,t=yearsBetween(l.startDate);
  let amt;
  if(l.type==='simple')amt=P*(1+r*t);
  else{const n=l.type==='monthly'?12:l.type==='quarterly'?4:1;amt=P*Math.pow(1+r/n,n*t);}
  return {mode:'accrue',interest:amt-P,total:amt,days:daysBetween(l.startDate)};
}

function bondCalc(b){
  const face=+b.amount||0;
  if(b.btype==='trade'){
    const cur=(b.currentValue!=null&&b.currentValue!==''?+b.currentValue:face);
    return {btype:'trade',invested:face,current:cur,pl:cur-face,interestToDate:0};
  }
  if(b.btype==='fixedpay'){
    const ma=+b.monthlyAmount||0, tot=+b.months||0;
    const elapsed=tot?Math.min(tot,monthsBetween(b.buyDate)):monthsBetween(b.buyDate);
    const received=elapsed*ma;
    const totalInterest=tot?tot*ma:null;
    return {btype:'fixedpay',invested:face,current:face+received,interestToDate:received,totalInterest,monthly:ma,months:tot,elapsed,pl:received};
  }
  const r=(+b.rate||0)/100, tEl=yearsBetween(b.buyDate);
  const tMat=b.maturityDate?Math.max(0,(new Date(b.maturityDate)-new Date(b.buyDate))/(1000*60*60*24*365.25)):null;
  let interestToDate,totalInterest;
  if(b.freq==='cumulative'){interestToDate=face*(Math.pow(1+r,tEl)-1);totalInterest=tMat!=null?face*(Math.pow(1+r,tMat)-1):null;}
  else{interestToDate=face*r*tEl;totalInterest=tMat!=null?face*r*tMat:null;}
  return {btype:'fixed',invested:face,current:face+interestToDate,interestToDate,totalInterest,tMat,pl:interestToDate};
}

async function fetchMfNav(code){const r=await fetch('/api/mf?code='+encodeURIComponent(code));const j=await r.json();if(isFinite(j.nav))return j.nav;throw new Error('no nav');}
async function fetchStockPrice(symbol,exch){const r=await fetch('/api/stock?symbol='+encodeURIComponent(symbol)+'&exch='+exch);const j=await r.json();if(isFinite(j.price))return j.price;throw new Error('no price');}

async function refreshAll(){
  const btn=document.getElementById('refreshBtn');btn.disabled=true;btn.textContent='↻ Update ho raha hai…';
  let mfOk=0,stkOk=0,stkFail=0;
  for(const m of state.mfs){if(m.schemeCode){try{m.currentNav=await fetchMfNav(m.schemeCode);mfOk++;}catch(e){}}}
  for(const s of state.stocks){try{s.currentPrice=await fetchStockPrice(s.symbol,s.exch);s.auto=true;stkOk++;}catch(e){s.auto=false;stkFail++;}}
  saveState();render();btn.disabled=false;btn.textContent='↻ Live Rates Update';
  let msg='MF: '+mfOk+'/'+state.mfs.filter(m=>m.schemeCode).length;
  if(state.stocks.length)msg+=' · Stocks: '+stkOk+'/'+state.stocks.length+(stkFail?' ('+stkFail+' manual)':'');
  toast(msg);
}

function computeTotals(st){
  st=st||{};
  let sInv=0,sCur=0,mInv=0,mCur=0,lPrin=0,lInt=0,bInv=0,bCur=0;
  (st.stocks||[]).filter(x=>!x.exclude).forEach(s=>{sInv+=s.qty*s.buyPrice;sCur+=s.qty*(s.currentPrice||s.buyPrice);});
  (st.mfs||[]).filter(x=>!x.exclude).forEach(m=>{mInv+=m.units*m.buyNav;mCur+=m.units*(m.currentNav||m.buyNav);});
  (st.loans||[]).filter(x=>!x.exclude).forEach(l=>{const c=loanInterest(l);lPrin+=(+l.principal||0);lInt+=c.interest;});
  (st.bonds||[]).filter(x=>!x.exclude).forEach(b=>{const c=bondCalc(b);bInv+=c.invested;bCur+=c.current;});
  const invested=sInv+mInv+lPrin+bInv,current=sCur+mCur+lPrin+lInt+bCur;
  return {sInv,sCur,mInv,mCur,lPrin,lInt,bInv,bCur,bGain:bCur-bInv,invested,current,net:current-invested,stockPL:sCur-sInv,mfPL:mCur-mInv};
}
function totals(){return computeTotals(state);}

function render(){
  const t=totals(),netPct=t.invested?(t.net/t.invested*100):0;
  document.getElementById('app').innerHTML=
    acctBar()
    +'<div class="pl-strip"><div><div class="net-lbl">Total Net Profit / Loss</div>'
    +'<div class="net '+plClass(t.net)+'">'+plSign(t.net)+inr(t.net)+' <span style="font-size:16px">('+plSign(netPct)+netPct.toFixed(2)+'%)</span></div></div>'
    +'<div class="breakdown"><div>Invested<b class="num">'+inr(t.invested)+'</b></div><div>Current Value<b class="num">'+inr(t.current)+'</b></div></div></div>'
    +'<div class="summary">'
    +'<div class="card"><div class="lbl">Stocks</div><div class="big num">'+inr(t.sCur)+'</div><div class="sm num '+plClass(t.stockPL)+'">'+plSign(t.stockPL)+inr(t.stockPL)+'</div></div>'
    +'<div class="card"><div class="lbl">Mutual Funds</div><div class="big num">'+inr(t.mCur)+'</div><div class="sm num '+plClass(t.mfPL)+'">'+plSign(t.mfPL)+inr(t.mfPL)+'</div></div>'
    +'<div class="card"><div class="lbl">Bonds</div><div class="big num">'+inr(t.bCur)+'</div><div class="sm num '+plClass(t.bGain)+'">'+plSign(t.bGain)+inr(t.bGain)+'</div></div>'
    +'<div class="card"><div class="lbl">Loan Principal</div><div class="big num">'+inr(t.lPrin)+'</div><div class="sm" style="color:var(--muted)">diya hua</div></div>'
    +'<div class="card"><div class="lbl">Interest Earned</div><div class="big num gain">'+inr(t.lInt)+'</div><div class="sm" style="color:var(--muted)">aaj tak</div></div></div>'
    +'<div class="tabs">'+tabBtn('graph','📊 Graph')+tabBtn('stocks','Stocks')+tabBtn('mfs','Mutual Funds')+tabBtn('bonds','Bonds')+tabBtn('loans','Loans / Interest')+tabBtn('support','💬 Support')+(myIsAdmin?tabBtn('admin','👥 Accounts'):'')+'</div>'
    +'<div class="panel '+(activeTab==='graph'?'active':'')+'">'+renderGraph()+'</div>'
    +'<div class="panel '+(activeTab==='stocks'?'active':'')+'">'+renderStocks()+'</div>'
    +'<div class="panel '+(activeTab==='mfs'?'active':'')+'">'+renderMfs()+'</div>'
    +'<div class="panel '+(activeTab==='bonds'?'active':'')+'">'+renderBonds()+'</div>'
    +'<div class="panel '+(activeTab==='loans'?'active':'')+'">'+renderLoans()+'</div>'
    +'<div class="panel '+(activeTab==='support'?'active':'')+'">'+renderSupport()+'</div>'
    +(myIsAdmin?'<div class="panel '+(activeTab==='admin'?'active':'')+'">'+renderAdmin()+'</div>':'');
}
function tabBtn(id,label){return '<button class="tab '+(activeTab===id?'active':'')+'" onclick="switchTab(\''+id+'\')">'+label+'</button>';}
function switchTab(id){activeTab=id;editStock=editMf=editLoan=editBond=null;
  if(id==='admin'){loadAdminUsers();}
  else if(id==='support'){if(myIsAdmin){supportOpenUser=null;loadSupportConvos();}else{loadUserChat();}}
  else{render();}
}
function exBtn(kind,it){return '<button class="edit" title="Portfolio total me gino / na gino" onclick="toggleExclude(\''+kind+'\',\''+it.id+'\')" style="'+(it.exclude?'border-color:var(--loss);color:var(--loss)':'border-color:var(--brass-dim);color:var(--brass)')+'">'+(it.exclude?'⊘':'∑')+'</button>';}
function toggleExclude(kind,id){const it=(state[kind]||[]).find(x=>x.id===id);if(it){it.exclude=!it.exclude;saveState();render();}}

/* ---------- STOCKS ---------- */
function renderStocks(){
  const rows=state.stocks.map(s=>{
    const inv=s.qty*s.buyPrice,cur=s.qty*(s.currentPrice||s.buyPrice),pl=cur-inv,pct=inv?(pl/inv*100):0;
    return '<tr><td><span class="name">'+escapeHtml(s.symbol)+'</span><span class="tag">'+s.exch+' · '+s.qty+' qty · '+(s.auto?'live':'manual')+'</span></td>'
      +'<td class="num">'+inr2(s.buyPrice)+'</td>'
      +'<td class="num"><input class="price-in num" type="number" step="0.01" value="'+(s.currentPrice||s.buyPrice)+'" onchange="setStockPrice(\''+s.id+'\',this.value)"></td>'
      +'<td class="num">'+inr(inv)+'</td><td class="num">'+inr(cur)+'</td>'
      +'<td class="num '+plClass(pl)+'">'+plSign(pl)+inr(pl)+'<br><span style="font-size:11px">'+plSign(pct)+pct.toFixed(1)+'%</span></td>'
      +'<td>'+exBtn('stocks',s)+'<button class="edit" onclick="startEditStock(\''+s.id+'\')">✎</button><button class="del" onclick="delItem(\'stocks\',\''+s.id+'\')">✕</button></td></tr>';
  }).join('');
  const e=editStock?state.stocks.find(x=>x.id===editStock):null;
  return '<table class="tbl"><thead><tr><th>Stock</th><th>Buy Price</th><th>Current</th><th>Invested</th><th>Value</th><th>P/L</th><th></th></tr></thead>'
    +'<tbody>'+(rows||'<tr><td colspan="7" class="empty">Abhi koi stock nahi. Neeche add karein.</td></tr>')+'</tbody></table>'
    +'<div class="add-box"><h3>'+(e?'✎ Stock Edit karein':'+ Naya Stock Add karein')+(e?'<span class="cancel-link" onclick="cancelEdit()">cancel</span>':'')+'</h3>'
    +(e?'':'<div class="row"><div class="fld srch-wrap"><label>Naam se search (live)</label><input id="stk-search" placeholder="jaise: Reliance, TCS" style="width:340px" oninput="stockSearch(this.value)" autocomplete="off"><div id="stk-results"></div></div></div>'
    +'<div class="note" style="margin:6px 0 0">Search se chunein, ya niche Symbol khud daalein.</div>')
    +'<div class="row" style="margin-top:12px">'
    +'<div class="fld"><label>Symbol</label><input id="stk-sym" placeholder="RELIANCE" value="'+(e?attr(e.symbol):'')+'" style="width:130px"></div>'
    +'<div class="fld"><label>Exchange</label><select id="stk-exch"><option'+(e&&e.exch==='NSE'?' selected':'')+'>NSE</option><option'+(e&&e.exch==='BSE'?' selected':'')+'>BSE</option></select></div>'
    +'<div class="fld"><label>Quantity</label><input id="stk-qty" type="number" value="'+(e?e.qty:'')+'" placeholder="10" style="width:90px"></div>'
    +'<div class="fld"><label>Buy Price (₹)</label><input id="stk-bp" type="number" step="0.01" value="'+(e?e.buyPrice:'')+'" placeholder="1200" style="width:110px"></div>'
    +'<div class="fld"><label>Buy Date</label><input id="stk-dt" type="date" value="'+(e?attr(e.buyDate):'')+'"></div>'
    +'<button class="add-btn" onclick="saveStock()">'+(e?'Save':'Add')+'</button></div>'
    +'<div class="note">"Live Rates Update" dabate hi aaj ka price aa jayega.</div></div>';
}

let stockSel=null,stockTimer=null,stockResults=[];
function localStockMatch(q){
  const toks=q.toLowerCase().split(/\s+/).filter(Boolean);
  return STOCKS.filter(x=>{const hay=(x.n+' '+x.s).toLowerCase();return toks.every(t=>hay.includes(t));}).map(x=>({symbol:x.s,exch:'NSE',name:x.n}));
}
function renderStockResults(list){
  const box=document.getElementById('stk-results');if(!box)return;
  if(!list.length){box.innerHTML='<div class="search-results"><div style="cursor:default;color:var(--muted)">Nahi mila — niche Symbol khud daalein</div></div>';return;}
  stockResults=list.slice(0,30);
  box.innerHTML='<div class="search-results">'+stockResults.map((x,i)=>'<div data-i="'+i+'">'+escapeHtml(x.name)+' <span style="color:var(--muted)">· '+x.symbol+' ('+x.exch+')</span></div>').join('')+'</div>';
  box.querySelectorAll('[data-i]').forEach(el=>el.addEventListener('click',()=>{const x=stockResults[+el.dataset.i];pickStock(x.symbol,x.exch);}));
}
function stockSearch(q){
  clearTimeout(stockTimer);q=q.trim();const box=document.getElementById('stk-results');
  if(q.length<2){box.innerHTML='';return;}
  const local=localStockMatch(q);
  renderStockResults(local);
  stockTimer=setTimeout(async()=>{
    try{const res=await fetch('/api/stock-search?q='+encodeURIComponent(q));
      if(res.ok){const j=await res.json();if(Array.isArray(j)&&j.length){
        const seen=new Set(local.map(x=>x.symbol));
        renderStockResults(local.concat(j.filter(x=>!seen.has(x.symbol))));
      }}
    }catch(e){}
  },300);
}

function startEditLoan(id){editLoan=id;editStock=editMf=null;const l=state.loans.find(x=>x.id===id);loanMode=l.mode==='fixed'?'fixed':(l.type==='simple'?'simple':'compound');render();}
function saveLoan(){
  const name=document.getElementById('ln-name').value.trim();
  const amt=+document.getElementById('ln-amt').value;
  const dt=document.getElementById('ln-dt').value;
  const note=document.getElementById('ln-note').value.trim();
  if(!name||!amt||!dt){toast('Naam, rakam aur date bharein');return;}
  let obj;
  if(loanMode==='fixed'){
    const ma=+document.getElementById('ln-monthly').value,mo=+document.getElementById('ln-months').value;
    if(!ma||!mo){toast('Monthly rakam aur kitne mahine bharein');return;}
    obj={borrower:name,principal:amt,startDate:dt,note,mode:'fixed',monthlyAmount:ma,months:mo};
  }else{
    const rate=+document.getElementById('ln-rate').value;
    if(!rate){toast('Byaaj % bharein');return;}
    const type=loanMode==='compound'?document.getElementById('ln-freq').value:'simple';
    obj={borrower:name,principal:amt,startDate:dt,note,mode:'accrue',rate,type};
  }
  if(editLoan){const l=state.loans.find(x=>x.id===editLoan);['rate','type','monthlyAmount','months'].forEach(k=>delete l[k]);Object.assign(l,obj);editLoan=null;}
  else{obj.id=uid();state.loans.push(obj);}
  loanMode='simple';saveState();render();toast('Loan save ho gaya');
}

/* ---------- GRAPH ---------- */
function polar(cx,cy,r,ang){const a=(ang-90)*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];}
function arcPath(cx,cy,r,r2,a0,a1){
  const p0=polar(cx,cy,r,a1),p1=polar(cx,cy,r,a0),p2=polar(cx,cy,r2,a0),p3=polar(cx,cy,r2,a1);
  const large=(a1-a0)>180?1:0;
  return 'M'+p0[0]+' '+p0[1]+' A'+r+' '+r+' 0 '+large+' 0 '+p1[0]+' '+p1[1]+' L'+p2[0]+' '+p2[1]+' A'+r2+' '+r2+' 0 '+large+' 1 '+p3[0]+' '+p3[1]+' Z';
}
function svgDonut(segs){
  const total=segs.reduce((a,s)=>a+s.value,0);
  if(total<=0)return '<div class="empty">Abhi koi value nahi — pehle holdings add karein.</div>';
  let ang=0,paths='';
  segs.forEach(s=>{const sweep=s.value/total*360;paths+='<path d="'+arcPath(90,90,80,48,ang,ang+sweep-0.5)+'" fill="'+s.color+'"/>';ang+=sweep;});
  const legend=segs.map(s=>'<div style="display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0"><span style="width:12px;height:12px;border-radius:3px;background:'+s.color+';display:inline-block"></span>'+s.label+' — <b class="num">'+inr(s.value)+'</b> <span style="color:var(--muted)">('+(s.value/total*100).toFixed(1)+'%)</span></div>').join('');
  return '<div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap"><svg width="180" height="180" viewBox="0 0 180 180">'+paths+'<text x="90" y="86" text-anchor="middle" fill="var(--muted)" font-size="11">Total</text><text x="90" y="104" text-anchor="middle" fill="var(--text)" font-size="15" font-weight="700">'+inr(total)+'</text></svg><div>'+legend+'</div></div>';
}
function svgLine(hist){
  if(!hist||hist.length<2)return '<div class="note">Trend kal se banna shuru hoga — har din app kholne par ek point apne-aap add hota jayega.</div>';
  const w=580,h=190,pad=34;
  const vals=hist.map(p=>p.net);let min=Math.min.apply(null,vals),max=Math.max.apply(null,vals);
  if(min>0)min=0;if(max<0)max=0;if(min===max)max=min+1;
  const xs=i=>pad+(i/(hist.length-1))*(w-2*pad);
  const ys=v=>h-pad-((v-min)/(max-min))*(h-2*pad);
  const line=hist.map((p,i)=>xs(i)+','+ys(p.net)).join(' ');
  const zeroY=ys(0),last=hist[hist.length-1];
  return '<svg width="100%" viewBox="0 0 '+w+' '+h+'" style="max-width:'+w+'px">'
    +'<line x1="'+pad+'" y1="'+zeroY+'" x2="'+(w-pad)+'" y2="'+zeroY+'" stroke="var(--line)" stroke-dasharray="4 4"/>'
    +'<polyline points="'+line+'" fill="none" stroke="'+(last.net>=0?'var(--gain)':'var(--loss)')+'" stroke-width="2.5"/>'
    +'<circle cx="'+xs(hist.length-1)+'" cy="'+ys(last.net)+'" r="4" fill="'+(last.net>=0?'var(--gain)':'var(--loss)')+'"/>'
    +'<text x="'+(w-pad)+'" y="'+(ys(last.net)-8)+'" text-anchor="end" fill="var(--text)" font-size="12" font-weight="700">'+(last.net>=0?'+':'')+inr(last.net)+'</text></svg>'
    +'<div class="note">'+hist.length+' din ka trend · pehla: '+hist[0].d+' → aaj: '+last.d+'</div>';
}
function plBars(t){
  const rows=[['Stocks',t.stockPL],['Mutual Funds',t.mfPL],['Bonds',t.bGain],['Loan Interest',t.lInt]];
  const maxAbs=Math.max(1,Math.max.apply(null,rows.map(r=>Math.abs(r[1]))));
  return rows.map(r=>{const w=Math.abs(r[1])/maxAbs*100,cl=r[1]>=0?'var(--gain)':'var(--loss)';
    return '<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px"><span>'+r[0]+'</span><span class="num" style="color:'+cl+'">'+(r[1]>=0?'+':'')+inr(r[1])+'</span></div><div style="background:var(--ink);border-radius:6px;height:10px"><div style="width:'+w+'%;height:100%;background:'+cl+';border-radius:6px"></div></div></div>';}).join('');
}
function renderGraph(){
  const t=totals();
  const segs=[{label:'Stocks',value:t.sCur,color:'#C9A227'},{label:'Mutual Funds',value:t.mCur,color:'#4C8DFF'},{label:'Bonds',value:t.bCur,color:'#3DD68C'},{label:'Loans',value:t.lPrin+t.lInt,color:'#B57BE0'}].filter(s=>s.value>0);
  return '<div class="add-box"><h3>Paisa kahan laga hai (current value)</h3>'+svgDonut(segs)+'</div>'
    +'<div class="add-box"><h3>Net Profit / Loss — trend</h3>'+svgLine(state.history)+'</div>'
    +'<div class="add-box"><h3>Category-wise Profit / Loss</h3>'+plBars(t)+'</div>';
}
function maybeSnapshot(){
  if(!myId||viewingUserId!==myId)return;
  state.history=state.history||[];
  const today=new Date().toISOString().slice(0,10),t=computeTotals(state),last=state.history[state.history.length-1];
  if(!last||last.d!==today){state.history.push({d:today,net:t.net,cur:t.current,inv:t.invested});if(state.history.length>200)state.history=state.history.slice(-200);saveState();}
  else{last.net=t.net;last.cur=t.current;last.inv=t.invested;saveState();}
}

  const {error}=await sb.auth.signUp({email,password});
  if(error){toast(error.message);return;}
  toast('Account ban gaya! Ab Login dabayein.');
}
async function doLogin(){
  const email=document.getElementById('au-email').value.trim(),password=document.getElementById('au-pass').value;
  if(!email||!password){toast('Email aur password daalein');return;}
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  if(error){toast(error.message);return;}
  await afterLogin(data.session);
}
async function doLogout(){await sb.auth.signOut();myId=null;viewingUserId=null;state={stocks:[],mfs:[],loans:[],bonds:[]};renderAuth();}

async function doForgot(){
  const email=document.getElementById('au-email').value.trim();
  if(!email){toast('Pehle upar apna email daalein, phir ye dabayein');return;}
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin});
  if(error){toast(error.message);return;}
  toast('Reset link email par bhej diya — email kholkar link par click karein.');
}
function renderResetPassword(){
  const ha=document.getElementById('hdrActions');if(ha)ha.style.display='none';
  document.getElementById('app').innerHTML='<div class="add-box" style="max-width:440px;margin:24px auto"><h3>Naya password banayein</h3>'
    +'<div class="fld" style="margin-bottom:14px"><label>Naya Password</label><input id="rp-pass" type="password" placeholder="6+ akshar" style="width:100%"></div>'
    +'<button class="add-btn" onclick="doResetPassword()">Save karein</button></div>';
}
async function doResetPassword(){
  const p=document.getElementById('rp-pass').value;if(p.length<6){toast('6+ akshar ka password daalein');return;}
  const {error}=await sb.auth.updateUser({password:p});
  if(error){toast(error.message);return;}
  toast('Password badal gaya!');
  const {data:{session}}=await sb.auth.getSession();
  if(session)await afterLogin(session);else renderAuth();
}

async function loadAdminUsers(){
  render();
  try{
    const [pr,po]=await Promise.all([
      sb.from('profiles').select('id,email,is_admin').order('email'),
      sb.from('portfolios').select('user_id,data')
    ]);
    const pmap={};(po.data||[]).forEach(p=>pmap[p.user_id]=p.data||{});
    adminUsers=(pr.data||[]).map(u=>({id:u.id,email:u.email,is_admin:u.is_admin,tot:computeTotals(pmap[u.id]||{})}));
  }catch(e){adminUsers=[];}
  render();
}
function renderAdmin(){
  if(!adminUsers.length)return '<div class="empty">Users load ho rahe hain… (ya abhi koi user nahi)</div>';
  const rows=adminUsers.map(u=>'<tr>'
    +'<td><span class="name">'+escapeHtml(u.email||'—')+'</span>'+(u.is_admin?' <span class="tag" style="color:var(--gain);display:inline">admin</span>':'')+'</td>'
    +'<td class="num">'+inr(u.tot.current)+'</td>'
    +'<td class="num '+plClass(u.tot.net)+'">'+plSign(u.tot.net)+inr(u.tot.net)+'</td>'
    +'<td><button class="edit" onclick="openUser(\''+u.id+'\',\''+escapeHtml(u.email||'')+'\')">Open</button></td></tr>').join('');
  return '<table class="tbl"><thead><tr><th>User</th><th>Net Worth</th><th>Profit/Loss</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>'
    +'<div class="note">Kisi user ko "Open" karke uska poora portfolio dekh/badal sakte ho — badalne par usi ke account me save hoga. Upar "← mera account" se wapas.</div>';
}
function openUser(uid,email){viewingUserId=uid;viewingEmail=email;loadPortfolio(uid).then(()=>{activeTab='stocks';render();});}
function backToMine(){viewingUserId=myId;viewingEmail=myEmail;loadPortfolio(myId).then(()=>{activeTab='stocks';render();});}

async function afterLogin(session){
  myId=session.user.id;myEmail=session.user.email;
  const ha=document.getElementById('hdrActions');if(ha)ha.style.display='flex';
  try{const r=await sb.from('profiles').select('is_admin').eq('id',myId).maybeSingle();myIsAdmin=!!(r.data&&r.data.is_admin);}catch(e){myIsAdmin=false;}
  try{const st=await sb.from('app_settings').select('*').eq('id',1).maybeSingle();appSettings=st.data||{};}catch(e){appSettings={};}
  setupRealtime();
  viewingUserId=myId;viewingEmail=myEmail;
  await loadPortfolio(myId);
  maybeSnapshot();
  const ac=document.getElementById('autoChk');if(ac)ac.checked=autoOn;
  activeTab='graph';render();
}
async function initApp(){
  if(!SUPABASE_URL||!SUPABASE_ANON_KEY||SUPABASE_URL.indexOf('YAHAN')>-1||SUPABASE_ANON_KEY.indexOf('YAHAN')>-1){document.getElementById('app').innerHTML='<div class="add-box" style="max-width:520px;margin:24px auto"><h3>Ek chhota setup baaki hai</h3><div class="note">config.js file me apni SUPABASE_URL aur PUBLISHABLE KEY daalein (README dekhein), phir dobara deploy karein.</div></div>';return;}
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  const {data:{session}}=await sb.auth.getSession();
  if(session){await afterLogin(session);}else{renderAuth();}
  sb.auth.onAuthStateChange((ev,s)=>{if(ev==='PASSWORD_RECOVERY'){renderResetPassword();return;}if(s&&!myId){afterLogin(s);}if(!s&&myId){myId=null;renderAuth();}});
}
initApp();
</script>
</body>
</html>
